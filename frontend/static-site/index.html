                body: `本场 1X2 有 ${market.books} 家市场去水均值。差异为负，说明市场比模型更激进；差异为正，说明模型更愿意给这个方向。`
              },
              {
                title: `大小球不能跟胜负混着看`,
                body: `大2.5 模型 ${pct(match.p_over_2_5)}，市场状态 ${totals.status || "missing"}。胜率高的比赛也可能小比分，弱队早崩的比赛也可能突然变大。`
              }
            ]
          };
        }
        return {
          title: "没有真实市场时，我只信比分矩阵",
          kicker: "市场缺口",
          source: "model fair line",
          points: [
            {
              title: "不拿别的市场偷换盘口",
              body: `本场 1X2 市场缺口，所以胜负、让球、大小球都从同一张比分分布推导，避免拿冠军市场或别场赔率硬套。`
            },
            {
              title: "置信度会被主动压低",
              body: `市场覆盖不足会降低置信度；这不是页面弱点，而是避免把没有验证的数据包装得太满。`
            }
          ]
        };
      }

      function eventSection(match, favoriteSide, favorite, underdog, archetype) {
        const corners = match.event_predictions?.corners || {};
        const cards = match.event_predictions?.cards || {};
        const score = match.event_predictions?.score || {};
        if (archetype.key === "set_piece") {
          return {
            title: "角球不是附属统计，是这场的第二进攻体系",
            kicker: "角球",
            source: match.event_predictions?.source || "event priors",
            points: [
              { title: "边路压力会以角球形式留痕", body: `总角球 ${value(corners.total_expected, 1)}，大8.5 ${pct(corners.over_8_5_probability)}，大9.5 ${pct(corners.over_9_5_probability)}。如果${favorite}长时间压住，角球会比控球率更能说明真实压力。` },
              { title: "角球多不等于自动进球", body: `真正要看的是连续角球后的盯人质量、二点球和禁区弧顶远射。单个角球的转化率低，连续角球的心理压力高。` }
            ]
          };
        }
        if (archetype.key === "card_chaos") {
          return {
            title: "牌会改变防守动作，也会改变盘口节奏",
            kicker: "红黄牌",
            source: match.event_predictions?.source || "cards priors",
            points: [
              { title: "黄牌线值得单独看", body: `总黄牌 ${value(cards.total_yellow_expected, 1)}，大3.5 ${pct(cards.over_3_5_yellow_probability)}，大4.5 ${pct(cards.over_4_5_yellow_probability)}。一旦边路或后腰早早吃牌，对抗强度会被迫下降。` },
              { title: "红牌是低频高冲击", body: `任一红牌 ${pct(cards.any_red_probability)}。它不该被当成主预测，但一旦发生，胜负、大小球和角球都会进入另一个世界。` }
            ]
          };
        }
        return {
          title: "比分、角球和牌必须互相解释",
          kicker: "事件盘口",
          source: match.event_predictions?.source || "score/event priors",
          points: [
            { title: "比分峰值只是分布最高点", body: `预期进球 ${value(score.expected_home_goals ?? match.lambda_home, 2)}:${value(score.expected_away_goals ?? match.lambda_away, 2)}，最可能比分 ${formatLikelyScore(match)}。单点比分天然方差大，不能当预言。` },
            { title: "角球和牌告诉我们比赛会不会变形", body: `总角球 ${value(corners.total_expected, 1)}、总黄牌 ${value(cards.total_yellow_expected, 1)}。如果这两个数一起抬高，比赛更可能从流畅控球变成定位球和对抗。` }
          ]
        };
      }

      function setPieceConversionSection(match, favoriteSide, favorite, underdog) {
        const tech = match.tactical_profile || {};
        const favTech = favoriteSide === "home" ? tech.home : tech.away;
        return {
          title: "定位球怎么真正变成比分",
          kicker: "转化路径",
          source: "set-piece proxy",
          points: [
            { title: "第一点不是全部，二点球才是连续压力", body: `${favorite}定位球 xG 占比 ${pct(favTech?.set_piece_xg_share)}。如果${underdog}第一点能顶出去，但解围落在禁区弧附近，下一脚远射或二次传中才是危险。` },
            { title: "前场压迫会制造更多死球", body: `角球多通常来自边路被迫解围，不是单纯“想传中”。这也是为什么强队压迫和角球线经常一起出现。` }
          ]
        };
      }

      function cardChainSection(match, favoriteSide, favorite, underdog) {
        return {
          title: "我不怕犯规多，我怕犯规发生在坏位置",
          kicker: "纪律链条",
          source: "cards + set pieces",
          points: [
            { title: "后腰和边后卫的早牌最危险", body: `如果${underdog}防守外侧过早吃牌，后面就不敢贴身，${favorite}的内切、传中和二点球都会变得更舒服。` },
            { title: "领先方也可能被牌拖慢", body: `${favorite}如果为了反抢吃牌，领先后就会减少压迫强度，深盘和角球大都可能被影响。` }
          ]
        };
      }

      function weatherSection(match, favoriteSide, favorite, underdog) {
        return {
          title: "天气不直接决定胜负，但会改变进球形状",
          kicker: "天气",
          source: match.weather?.source || "Open-Meteo",
          points: [
            { title: "传控失误会比平时更贵", body: `${match.weather?.condition || "normal"}、风速 ${value(match.weather?.wind_kph, 1)} km/h、湿度 ${value(match.weather?.humidity_pct, 0)}%。这种条件下，停球、长传落点和门将二次处理都会比平时更不稳定。` },
            { title: "大小球要看脏机会，不只看技术优势", body: `天气会压低流畅进攻，但也可能增加折射、滑倒、解围不远。它对总进球是双向影响，所以我只给低权重。` }
          ]
        };
      }

      function firstGoalSection(match, favoriteSide, favorite, underdog) {
        const draw = Number(match.p_draw || 0);
        return {
          title: "第一球会把整场比赛重新定价",
          kicker: "比分路径",
          source: "scoreline matrix",
          points: [
            { title: "如果前30分钟还是0-0", body: `平局概率 ${pct(draw)} 不低，时间越往后，${underdog}受让盘越硬，${favorite}会更急，反击空间也会变大。` },
            { title: "如果${favorite}先进", body: `比赛会从胜负题切成盘口题；${underdog}被迫前压后，第二球的空间才真正出来。` }
          ]
        };
      }

      function postMatchSection(match, top, favoriteSide, favorite, underdog) {
        if (!hasActualScore(match)) return null;
        const homeScore = Number(match.live_status.home_score);
        const awayScore = Number(match.live_status.away_score);
        const actual = actualOutcome(match);
        const total = homeScore + awayScore;
        const predictedTotal = Number(match.lambda_home || 0) + Number(match.lambda_away || 0);
        const outcomeText = actual === top.key ? "胜负方向命中" : "胜负方向偏离";
        const score = match.event_predictions?.score || {};
        return {
          title: "赛后先验复盘：哪里对了，哪里明显低估了",
          kicker: "复盘",
          source: match.live_status?.source || "public scoreboard",
          points: [
            { title: outcomeText, body: `赛前主方向是 ${top.label} ${pct(top.probability)}，实际 ${actualScore(match, score)}。方向只是第一层，真正要复盘的是比分、盘口和事件线。` },
            { title: total > predictedTotal + 1.5 ? "总进球被明显低估" : "总进球基本在可解释区间", body: `模型预期总进球 ${value(predictedTotal, 2)}，实际总进球 ${total}。如果偏离很大，通常说明早球、红牌、换人火力或弱队崩盘没有被赛前充分捕捉。` }
          ]
        };
      }

      function sceneTitle(archetype, seed) {
        const map = {
          deep_favorite: ["我脑子里的净胜球剧本", "这场怎么从优势变成大比分", "深盘成败的几个镜头"],
          set_piece: ["角球和定位球的几个画面", "边路压迫怎样堆出机会", "我看的不是控球率，是死球窗口"],
          card_chaos: ["犯规把比赛切碎的几个瞬间", "牌局会怎样改变比赛", "纪律风险的几个镜头"],
          weather_drag: ["天气把比赛拖慢的几个画面", "场地和天气制造的脏机会", "环境变量怎么改写节奏"],
          knife_edge: ["细节局的几个分岔点", "第一球之前和之后", "这场最容易变形的几个瞬间"]
        };
        return pickSeeded(map[archetype.key] || ["我脑子里的比赛镜头", "比赛可能这样展开", "几个关键画面"], seed);
      }

      function reportScenes(match, favoriteSide, favorite, underdog, archetype, seed) {
        const score = match.event_predictions?.score || {};
        const corners = match.event_predictions?.corners || {};
        const cards = match.event_predictions?.cards || {};
        const favGoals = favoriteSide === "home" ? score.expected_home_goals : score.expected_away_goals;
        const dogGoals = favoriteSide === "home" ? score.expected_away_goals : score.expected_home_goals;
        if (archetype.key === "deep_favorite") {
          return [
            { title: "开场：先看压迫是否把球锁在前场", body: `${favorite}如果能连续抢二点，${underdog}的反击起点会被压到很低；如果抢不住，深盘马上变难。`, tag: "压迫" },
            { title: "第一个进球后：油门选择决定盘口", body: `预期进球 ${value(favGoals, 2)}:${value(dogGoals, 2)}。1-0 后继续压，是 -1.5 的生命线；1-0 后控节奏，就是受让方的机会。`, tag: "盘口" },
            { title: "60分钟后：替补和体能差开始放大", body: `${underdog}长时间无球防守后，横移和解围距离会下降，这时角球、折射和二点球最容易连续出现。`, tag: "后程" }
          ];
        }
        if (archetype.key === "set_piece") {
          return [
            { title: "前20分钟：边路反复试底线", body: `${favorite}不一定每次都能传出高质量球，但只要逼出解围，角球数就会开始堆。`, tag: "边路" },
            { title: "角球第6到第9个：盯人注意力下降", body: `大8.5 ${pct(corners.over_8_5_probability)}，大9.5 ${pct(corners.over_9_5_probability)}。连续角球的威胁不是单次概率，是防线会越来越乱。`, tag: "角球" },
            { title: "二点球：真正的第二进攻", body: "第一点被顶出不代表安全，禁区弧顶的二点远射和二次传中才是比分突然打开的入口。", tag: "二点" }
          ];
        }
        if (archetype.key === "card_chaos") {
          return [
            { title: "前25分钟：第一张牌定调", body: `黄牌大3.5 ${pct(cards.over_3_5_yellow_probability)}。如果边后卫或后腰先吃牌，后面每次一对一都会变得保守。`, tag: "黄牌" },
            { title: "中段：犯规后的定位球最危险", body: "犯规不一定直接伤害比分，坏位置犯规才会；它会把普通防守回合变成任意球、二点球和禁区混战。", tag: "死球" },
            { title: "尾声：红牌尾部风险", body: `任一红牌 ${pct(cards.any_red_probability)}。这个数字不高，但一旦发生，赛前分布就要重算。`, tag: "尾部" }
          ];
        }
        if (archetype.key === "weather_drag") {
          return [
            { title: "开局：先适应球速和落点", body: `${match.weather?.condition || "normal"} 条件下，停球和长传落点会更容易出错，前10分钟的处理质量很关键。`, tag: "天气" },
            { title: "中段：脏机会比漂亮配合更真实", body: "折射、滑倒、解围不远、门将脱手，这些低观赏性画面反而可能比连续传控更接近进球。", tag: "混战" },
            { title: "后段：体能和湿度开始收费", body: `湿度 ${value(match.weather?.humidity_pct, 0)}%，风速 ${value(match.weather?.wind_kph, 1)} km/h。最后半小时跑动质量会下滑。`, tag: "体能" }
          ];
        }
        return [
          { title: "前20分钟：谁先暴露出球问题", body: `${favorite}会试着把阵型推上去，${underdog}只要能把第一脚纵向传球送出来，比赛就不会那么单边。`, tag: "试探" },
          { title: "35分钟前后：第一球窗口", body: `比分峰值 ${formatLikelyScore(match)}。如果这阶段仍是0-0，平局和小比分权重会明显上升。`, tag: "第一球" },
          { title: "60分钟后：换人改变对位", body: "五五开和常规优势局最怕替补改变速度、高点或持球点，一个对位变化可能直接改变盘口方向。", tag: "换人" },
          { title: "最后15分钟：犯规和定位球收尾", body: `黄牌预期 ${value(cards.total_yellow_expected, 1)}，角球预期 ${value(corners.total_expected, 1)}。尾声更像事件管理，不像纯控球比赛。`, tag: "收官" }
        ];
      }

      function riskTitle(archetype) {
        if (archetype.key === "deep_favorite") return "最容易打脸深盘的地方";
        if (archetype.key === "set_piece") return "最容易打脸角球剧本的地方";
        if (archetype.key === "card_chaos") return "最容易打脸牌局判断的地方";
        if (archetype.key === "weather_drag") return "最容易打脸天气剧本的地方";
        if (archetype.key === "knife_edge") return "最容易打脸细节局的地方";
        return "最容易打脸我的地方";
      }

      function reportRisks(match, top, favoriteSide, favorite, underdog, archetype) {
        const topScore = (match.top_scorelines || [])[0];
        const risks = [];
        if (archetype.key === "deep_favorite") {
          risks.push({ title: `${favorite}领先后提前收油`, body: `这是深盘最常见的错法：胜负方向对了，但2-0后降速，-1.5或-2.5就会危险。` });
        } else if (archetype.key === "knife_edge") {
          risks.push({ title: "一个早球把五五开打碎", body: "细节局的赛前分布最怕早段进球，早球会让落后方提前压上，后面的大小球和角球全变形。" });
        } else if (archetype.key === "set_piece") {
          risks.push({ title: "角球堆了，但质量太差", body: "角球数能说明压力，不保证进球。如果传中质量、第一点和二点球都差，最后可能只是好看不好用。" });
        } else if (archetype.key === "card_chaos") {
          risks.push({ title: "裁判尺度比模型更松", body: "如果裁判允许身体对抗，黄牌线和定位球连锁都会被压低，原本的犯规剧本就会失效。" });
        } else if (archetype.key === "weather_drag") {
          risks.push({ title: "天气没有真正影响到比赛", body: "预报存在误差，场地排水和风向也会改变影响强度；如果环境没那么糟，技术优势会更正常释放。" });
        }
        risks.push(
          { title: `${underdog}低位防守执行超预期`, body: `如果${underdog}前60分钟不丢或只丢一个，${favorite}的胜率仍在，但盘口、大小球和比分都会被压低。` },
          { title: "机会转化率随机波动", body: `最可能比分单点概率 ${pct(topScore?.probability)}。这说明比分盘天然分散，射门转化率一偏，剧本就会看起来完全不同。` },
          { title: "球员层仍是代理画像", body: "我们没有真实首发、逐球员评分和临场伤停 feed，所以这部分不会被包装成硬结论；接入后再提高模型权重。" }
        );
        return risks.slice(0, 4);
      }

      function reportFinalLine(match, top, score, direction, archetype) {
        const actual = hasActualScore(match) ? `实际 ${actualScore(match, match.event_predictions?.score || {})}；` : "";
        return `最终一句话：${actual}主方向 ${top.label}，比分峰值 ${score}，盘口看 ${direction}。这份报告按「${archetype.label}」生成，材料来自当前公开数据和模型分布，不是投注指令。`;
      }

      function seededIndex(match, salt = 0) {
        const raw = `${match.match_id || match.fixture?.id || ""}:${salt}`;
        let hash = 0;
        for (let i = 0; i < raw.length; i += 1) hash = ((hash << 5) - hash + raw.charCodeAt(i)) | 0;
        return Math.abs(hash);
      }

      function pickSeeded(items, seed) {
        return items.length ? items[seed % items.length] : "";
      }

      function buildScriptAnalysis(match) {
        const home = teamName(match.home_team);
        const away = teamName(match.away_team);
        const outcomes = [
          { key: "home", label: `${home}胜`, team: home, probability: Number(match.p_home || 0) },
          { key: "draw", label: "平局", team: "平局", probability: Number(match.p_draw || 0) },
          { key: "away", label: `${away}胜`, team: away, probability: Number(match.p_away || 0) }
        ].sort((a, b) => b.probability - a.probability);
        const top = outcomes[0];
        const favoriteSide = top.key === "draw" ? (Number(match.p_home || 0) >= Number(match.p_away || 0) ? "home" : "away") : top.key;
        const favorite = favoriteSide === "home" ? home : away;
        const underdog = favoriteSide === "home" ? away : home;
        const confidence = confidenceScore(match);
        const archetype = scriptArchetype(match, top, favoriteSide);
        const direction = scriptDirection(match, top, favoriteSide, favorite, underdog);
        const score = formatLikelyScore(match);
        return {
          archetype: archetype.label,
          opening: scriptOpening(match, top, favorite, direction, archetype),
          lean: `${top.label} ${pct(top.probability)}`,
          direction,
          score,
          confidence: `${pct(confidence)} · ${(match.confidence_profile || {}).tier || "中"}`,
          picture: scriptPicture(match, favoriteSide, favorite, underdog, archetype),
          keyPoints: scriptKeyPoints(match, favoriteSide, favorite, underdog, archetype),
          fadePoints: scriptFadePoints(match, favoriteSide, favorite, underdog, archetype),
          scenes: scriptScenes(match, favoriteSide, favorite, underdog, archetype),
          phases: scriptPhases(match, top, favorite, underdog, archetype),
          risks: scriptRisks(match, favorite, underdog, archetype),
          finalLine: scriptFinalLine(match, top, score, direction)
        };
      }

      function scriptArchetype(match, top, favoriteSide) {
        const favoriteMinus25 = favoriteCoverage(match, favoriteSide, 2.5);
        const favoriteMinus15 = favoriteCoverage(match, favoriteSide, 1.5);
        const corners = match.event_predictions?.corners || {};
        const cards = match.event_predictions?.cards || {};
        const weather = String(match.weather?.condition || "").toLowerCase();
        const upset = match.matchup?.upset_profile || {};
        if (top.probability >= 0.66 || favoriteMinus25 >= 0.2) {
          return { key: "deep_favorite", label: "强弱深盘局", focus: "净胜球、替补火力、后段穿盘" };
        }
        if (Number(corners.over_8_5_probability || 0) >= 0.68) {
          return { key: "set_piece", label: "角球定位球局", focus: "边路推进、二点球、角球线" };
        }
        if (Number(cards.over_3_5_yellow_probability || 0) >= 0.58 || Number(cards.any_red_probability || 0) >= 0.16) {
          return { key: "card_chaos", label: "犯规碎片局", focus: "黄牌节奏、定位球、防线纪律" };
        }
        if (/rain|storm|fog|snow|wind|heat|hot|雷|雨|雾|风|热/.test(weather)) {
          return { key: "weather_drag", label: "天气干扰局", focus: "传控失误、低质量射门、体能衰减" };
        }
        if (top.probability < 0.46 || Number(match.p_draw || 0) >= 0.28 || Number(upset.draw_probability || 0) >= 0.28) {
          return { key: "knife_edge", label: "五五开细节局", focus: "第一球、转换、谁先犯错" };
        }
        if (favoriteMinus15 >= 0.42) {
          return { key: "pressure_build", label: "优势压制局", focus: "控球压迫、禁区触球、盘口窗口" };
        }
        return { key: "balanced_edge", label: "常规优势局", focus: "胜平负主线、比分分布、风险控制" };
      }

      function scriptOpening(match, top, favorite, direction, archetype) {
        if (hasActualScore(match)) {
          return `这场已经有赛果，按赛前模型复盘：它原本被归为「${archetype.label}」，现在重点看主方向和盘口逻辑有没有兑现。`;
        }
        if (archetype.key === "deep_favorite") return `我更看好：${favorite}。这不是普通胜负题，而是${archetype.focus}一起决定的深盘题。`;
        if (archetype.key === "knife_edge") return `我更看好：${favorite}略占一档，但这场真正值钱的是细节，不是喊口号站队。`;
        if (archetype.key === "set_piece") return `我更看好：${favorite}方向，但这场的隐藏主线是角球和定位球，不是单纯控球率。`;
        if (archetype.key === "card_chaos") return `我更看好：${favorite}，但犯规和牌会把比赛切得很碎，节奏不一定顺着强队走。`;
        if (archetype.key === "weather_drag") return `我更看好：${favorite}，不过天气会压低技术动作质量，比分和盘口都要打折看。`;
        if (top.key === "draw") return "我更看好：平局。不是怂，是模型在说两边都没有一口吃掉比赛的能力。";
        if (top.probability >= 0.68) return `我更看好：${favorite}，方向很硬，但深盘能不能穿要单独算。`;
        if (top.probability >= 0.55) return `我更看好：${favorite}，优势明确，但不是闭眼碾压局。`;
        return `我更看好：${favorite}，但这是细节局，别把倾向当确定性。`;
      }

      function scriptDirection(match, top, favoriteSide, favorite, underdog) {
        if (top.key === "draw") return "平局/小比分优先";
        const minus25 = favoriteCoverage(match, favoriteSide, 2.5);
        const minus15 = favoriteCoverage(match, favoriteSide, 1.5);
        const minus05 = favoriteCoverage(match, favoriteSide, 0.5);
        const plus15 = underdogCoverage(match, favoriteSide, 1.5);
        if (minus25 >= 0.52) return `${favorite}大胜，-2.5 覆盖 ${pct(minus25)}`;
        if (minus15 >= 0.56) return `${favorite}赢 2 球以上倾向，-1.5 覆盖 ${pct(minus15)}`;
        if (minus05 >= 0.58) {
          if (plus15 >= 0.58) return `${favorite}常规胜，但${underdog}+1.5 仍有 ${pct(plus15)}`;
          return `${favorite}常规胜，-0.5 覆盖 ${pct(minus05)}`;
        }
        return `${favorite}方向略优，但让球别贪`;
      }

      function scriptPicture(match, favoriteSide, favorite, underdog, archetype) {
        const tech = match.tactical_profile || {};
        const favoriteTech = favoriteSide === "home" ? tech.home : tech.away;
        const underdogTech = favoriteSide === "home" ? tech.away : tech.home;
        const corners = match.event_predictions?.corners || {};
        const cards = match.event_predictions?.cards || {};
        const pressGap = Number(underdogTech?.ppda || 0) - Number(favoriteTech?.ppda || 0);
        if (archetype.key === "deep_favorite") {
          return `我敢押的一个具体画面：${favorite}前60分钟先把比赛打成半场攻防，真正拉开比分的是替补和体能差，${underdog}后场解围开始变短，第二点连续被抢。`;
        }
        if (archetype.key === "knife_edge") {
          return `我敢押的一个具体画面：前30分钟双方都不会完全冒险，第一粒进球更可能来自一次转换失误或定位球，而不是连续传控碾压。`;
        }
        if (archetype.key === "weather_drag") {
          return `我敢押的一个具体画面：雨雾或湿滑草皮让停球和长传质量下降，门将脱手、后卫解围不远，比漂亮配合更容易制造真正机会。`;
        }
        if (pressGap > 5) {
          return `我敢押的一个具体画面：${underdog}后场出球被连续压迫，60分钟后体能和传球质量一起掉线，${favorite}靠二次进攻或肋部渗透再补一刀。`;
        }
        if (Number(corners.total_expected || 0) >= 10) {
          return "我敢押的一个具体画面：两边反复把球打到边路，角球堆到 9 个以上，真正的破局点来自定位球和二点球。";
        }
        if (Number(cards.total_yellow_expected || 0) >= 4) {
          return "我敢押的一个具体画面：中场对抗变碎，黄牌把节奏切断，谁先在犯规后丢定位球，谁就可能先出事。";
        }
        return "我敢押的一个具体画面：前30分钟不会完全摊牌，比赛先从中场控制权和第一粒进球的心理压力开始倾斜。";
      }

      function scriptKeyPoints(match, favoriteSide, favorite, underdog, archetype) {
        const home = teamName(match.home_team);
        const away = teamName(match.away_team);
        const form = match.team_form || {};
        const tech = match.tactical_profile || {};
        const favoriteForm = favoriteSide === "home" ? form.home : form.away;
        const underdogForm = favoriteSide === "home" ? form.away : form.home;
        const favoriteTech = favoriteSide === "home" ? tech.home : tech.away;
        const underdogTech = favoriteSide === "home" ? tech.away : tech.home;
        const points = [
          {
            title: `${favorite}的底盘优势不是一句“名气大”`,
            body: `${home} vs ${away} 的 ELO 差是 ${signed((form.elo_gap || 0) / 100)} 档量级；${favorite}近况 ${favoriteForm?.last_10 || "-"}，${underdog}近况 ${underdogForm?.last_10 || "-"}。这类差距会先体现在控球安全和禁区前沿选择质量上。`
          },
          {
            title: `进攻产量更支持${favorite}这边`,
            body: `${favorite} xG ${value(favoriteTech?.xg_per_game, 2)}、射门 ${value(favoriteTech?.shots_per_game, 1)}、射正 ${value(favoriteTech?.shots_on_target_per_game, 1)}；${underdog}对应是 xG ${value(underdogTech?.xg_per_game, 2)}、射门 ${value(underdogTech?.shots_per_game, 1)}、射正 ${value(underdogTech?.shots_on_target_per_game, 1)}。这不是玄学，是机会数量在说话。`
          }
        ];
        const archetypePoint = scriptArchetypePoint(match, favoriteSide, favorite, underdog, archetype);
        if (archetypePoint) points.push(archetypePoint);
        const tacticalEdge = strongestTacticalEdge(match, favoriteSide);
        if (tacticalEdge) {
          points.push({
            title: `${tacticalEdge.label}是这场的放大器`,
            body: `这项对${favorite}的边际是 ${signed(tacticalEdge.edge)}，数据质量标为 ${tacticalEdge.quality}。它不一定直接决定胜负，但会决定优势是慢慢磨出来，还是突然在某个阶段连续爆发。`
          });
        }
        const corners = match.event_predictions?.corners || {};
        if (Number(corners.total_expected || 0) >= 8.5) {
          points.push({
            title: "角球和定位球可能把比赛推向更极端的比分",
            body: `模型给总角球 ${value(corners.total_expected, 1)}，大 8.5 概率 ${pct(corners.over_8_5_probability)}。如果${favorite}早早压住半场，角球会变成持续施压的计数器。`
          });
        }
        points.push(marketScriptPoint(match, favoriteSide, favorite));
        return points.slice(0, 5);
      }

      function scriptArchetypePoint(match, favoriteSide, favorite, underdog, archetype) {
        const corners = match.event_predictions?.corners || {};
        const cards = match.event_predictions?.cards || {};
        if (archetype.key === "deep_favorite") {
          const minus15 = favoriteCoverage(match, favoriteSide, 1.5);
          const minus25 = favoriteCoverage(match, favoriteSide, 2.5);
          return {
            title: "这场不能只看赢不赢，要拆成净胜几球",
            body: `${favorite}-1.5 覆盖 ${pct(minus15)}，-2.5 覆盖 ${pct(minus25)}。胜率高只是第一层，能不能打穿深盘取决于领先后是否继续压、替补火力和对手体能断点。`
          };
        }
        if (archetype.key === "knife_edge") {
          return {
            title: "第一球价值比控球率更高",
            body: `这类五五开细节局里，模型不会把控球率当答案。谁先丢球，谁就要从低风险计划切到追分计划，后面的角球、牌和反击空间都会变形。`
          };
        }
        if (archetype.key === "set_piece") {
          return {
            title: "定位球是这场的第二进攻体系",
            body: `总角球预期 ${value(corners.total_expected, 1)}，大 8.5 概率 ${pct(corners.over_8_5_probability)}。如果边路压制成立，角球不是附属品，而是连续施压的主渠道。`
          };
        }
        if (archetype.key === "card_chaos") {
          return {
            title: "牌会改变比赛的呼吸方式",
            body: `总黄牌预期 ${value(cards.total_yellow_expected, 1)}，大 3.5 概率 ${pct(cards.over_3_5_yellow_probability)}，任一红牌 ${pct(cards.any_red_probability)}。这种比赛容易被犯规、定位球和情绪波动切碎。`
          };
        }
        if (archetype.key === "weather_drag") {
          return {
            title: "天气会惩罚精细传控，也会制造脏机会",
            body: `天气标记为 ${match.weather?.condition || "normal"}。这类因子不该重压胜负模型，但会影响射门质量、门将处理和比赛节奏，所以适合进剧本，不适合单独下结论。`
          };
        }
        return null;
      }

      function marketScriptPoint(match, favoriteSide, favorite) {
        const market = match.market_summary?.one_x_two || {};
        if (market.status === "available") {
          const deltas = market.model_delta || {};
          return {
            title: "市场和模型不是完全同一张脸",
            body: `本场 1X2 有 ${market.books} 家市场去水均值；${favorite}方向的模型-市场差是 ${signedPct(deltas[favoriteSide] || 0)}。我看重的是差异是否可解释，而不是盲目站模型。`
          };
        }
        return {
          title: "没有真实 1X2 市场时，更要回到比分矩阵",
          body: "当前单场市场缺口会降低置信度，所以盘口和比分都从同一张比分分布推导，避免为每个市场单独编故事。"
        };
      }

      function scriptFadePoints(match, favoriteSide, favorite, underdog, archetype) {
        const topScore = (match.top_scorelines || [])[0];
        const minus25 = favoriteCoverage(match, favoriteSide, 2.5);
        const minus15 = favoriteCoverage(match, favoriteSide, 1.5);
        const upset = match.matchup?.upset_profile || {};
        const risks = [
          {
            title: `把${favorite}方向直接翻译成“大屠杀”，我不买账`,
            body: `${favorite}-1.5 覆盖 ${pct(minus15)}，-2.5 覆盖 ${pct(minus25)}。赢球概率高不等于深盘稳穿，这两件事必须分开看。`
          },
          {
            title: "精确比分只是分布峰值，不是预言",
            body: `最可能比分 ${formatLikelyScore(match)} 的单点概率只有 ${pct(topScore?.probability)}。比分盘天然方差大，看剧本可以，不能把它当确定答案。`
          },
          {
            title: `${underdog}不是完全没有活路`,
            body: `爆冷胜率 ${pct(upset.upset_win_probability)}，平局压力 ${pct(upset.draw_probability)}。这个数字不高，但足够提醒我们：早段不进球，热门方会越来越急。`
          }
        ];
        if (archetype.key === "deep_favorite") {
          risks.push({
            title: "大热门不等于自动穿深盘",
            body: `强弱差距会抬高胜率，但也会带来轮换、控节奏和浪费机会的问题。${favorite}如果 2-0 后降速，胜负对了，盘口也可能错。`
          });
        } else if (archetype.key === "knife_edge") {
          risks.push({
            title: "别把轻微优势包装成确定性",
            body: "这种局最容易被一个门将脱手、一张黄牌、一次VAR改变。模型倾向可以看，但不应该写成“没有悬念”。"
          });
        } else if (archetype.key === "set_piece") {
          risks.push({
            title: "角球多不等于进球多",
            body: "角球和定位球会放大压迫感，但如果第一点质量不够，最后可能只是堆数据，不一定转化成比分。"
          });
        }
        if ((match.risk_register || []).length) {
          risks.push({
            title: "数据源本身也有风险",
            body: `${match.risk_register[0].message} 这就是为什么页面把这段标成模型剧本，而不是下注结论。`
          });
        }
        return risks.slice(0, 4);
      }

      function scriptScenes(match, favoriteSide, favorite, underdog, archetype) {
        const score = match.event_predictions?.score || {};
        const corners = match.event_predictions?.corners || {};
        const cards = match.event_predictions?.cards || {};
        const favGoals = favoriteSide === "home" ? score.expected_home_goals : score.expected_away_goals;
        const dogGoals = favoriteSide === "home" ? score.expected_away_goals : score.expected_home_goals;
        if (archetype.key === "deep_favorite") {
          return [
            {
              title: "镜头1：开场压到30米区域",
              body: `${favorite}先把阵型顶上去，前场反抢和二点球会比单次射门更关键；${underdog}能不能把球带过中线，是第一道分水岭。`,
              tag: "压制"
            },
            {
              title: "镜头2：第一个进球后的油门选择",
              body: `模型预期进球是 ${value(favGoals, 2)} : ${value(dogGoals, 2)}。如果${favorite}领先后继续抢节奏，深盘才有生命；如果控住就收，比分会明显变小。`,
              tag: "穿盘"
            },
            {
              title: "镜头3：60分钟替补冲击",
              body: `${underdog}长时间无球防守后，横向移动会变慢。这个阶段最容易出现连续角球、二次进攻和比分突然被拉开。`,
              tag: "后段"
            },
            {
              title: "镜头4：最后15分钟净胜球管理",
              body: `如果净胜球仍有价值，${favorite}会继续找第五、第六脚高质量射门；如果任务已经完成，就会进入控节奏和保护主力模式。`,
              tag: "收割"
            }
          ];
        }
        if (archetype.key === "knife_edge") {
          return [
            {
              title: "镜头1：前20分钟互相摸底",
              body: "两边先试探对方中后场出球，真正的危险不是控球率，而是谁的第一脚纵向传球先被断。经典细节局，开局不会立刻摊牌。",
              tag: "试探"
            },
            {
              title: "镜头2：第一个定位球窗口",
              body: `总角球预期 ${value(corners.total_expected, 1)}。如果运动战打不开，前点摆渡、后点包抄和二点远射会比中路渗透更现实。`,
              tag: "破局"
            },

      function scriptPhases(match, top, favorite, underdog, archetype) {
        const likely = formatLikelyScore(match);
        const total = Number(match.p_over_2_5 || 0);
        const btts = Number(match.p_btts || 0);

          return [

              title: "前20分钟",

        if (archetype.key === "weather_drag") {

            {

        return [

          },
          {
            title: "上半场后段",
            value: likely,
            body: `如果比分向模型峰值靠拢，半场前最像 ${likely} 的低比分优势；大 2.5 概率 ${pct(total)}，双方进球 ${pct(btts)}。`
          },
          {
            title: "60-75分钟",
            value: "盘口窗口",
            body: "这是让球盘最敏感的阶段：领先方会决定继续踩油门还是控节奏，落后方的体能和纪律会被放大。"
          },
          {

            value: "复盘关键",
            body: `如果${favorite}只领先一球，最后会很紧；如果已经领先两球以上，角球、牌和替补冲击会比胜负更值得复盘。`
          },
          {
            title: "如果进加时/点球",
            value: "不存在",
            body: "这是小组赛，没有加时和点球大战；所有判断都只针对常规时间。"

      function scriptRisks(match, favorite, underdog, archetype) {
        const topScore = (match.top_scorelines || [])[0];
        const risks = [
          {
            title: `${underdog}低位防守比模型想象得更硬`,
            body: `如果${underdog}能把禁区前沿堵住，比赛可能从模型的 ${formatLikelyScore(match)} 变成更低节奏的小胜或平局。`
          },
          {
            title: `${favorite}机会转化率掉线`,
            body: `最可能比分单点概率 ${pct(topScore?.probability)}，说明同一个优势局也可能长成很多比分。射门质量一掉，穿盘就会先出问题。`
          },
          {
            title: "代理数据误导",
            body: "技术统计、球员状态和部分伤停仍有代理成分；如果真实首发或战术和先验不同，赛前剧本必须下调权重。"
          }
        ];
        if (archetype.key === "deep_favorite") {
          risks.unshift({
            title: "强队轮换或提前收油",
            body: `${favorite}如果两球领先后不再追净胜球，模型方向可能对，但比分、大小球和深盘都会被打脸。`
          });
        } else if (archetype.key === "knife_edge") {
          risks.unshift({
            title: "一个早球把全局推翻",
            body: "细节局最怕早段进球。早球会迫使落后方提前压上，原本的小比分和平局概率会迅速失真。"
          });
        } else if (archetype.key === "card_chaos") {
          risks.unshift({
            title: "红牌把模型前提直接砸碎",
            body: "红牌属于低频高冲击事件，一旦出现，赛前胜平负、大小球和角球节奏都会进入另一个分布。"
          });
        }
        return risks.slice(0, 4);
      }

      function scriptFinalLine(match, top, score, direction) {
        const status = hasActualScore(match) ? `实际比分 ${actualScore(match, match.event_predictions?.score || {})}。` : "";
        return `最终一句话：主方向是 ${top.label}，比分峰值是 ${score}，常规时间看 ${direction}。${status}这段是模型剧本，不是投注指令。`;
      }

      function formatLikelyScore(match) {
        const top = (match.top_scorelines || [])[0];
        if (!top) return "-";
        const parts = String(top.score || "").split("-");
        if (parts.length !== 2) return top.score;
        return `${teamName(match.home_team)} ${parts[0]}-${parts[1]} ${teamName(match.away_team)}`;
      }

      function favoriteCoverage(match, favoriteSide, minusLine) {
        const homeLine = favoriteSide === "home" ? -minusLine : minusLine;
        const row = findHandicapRow(match, homeLine);
        return Number(row?.[favoriteSide]?.positive_probability || 0);
      }

      function underdogCoverage(match, favoriteSide, plusLine) {
        const underdogSide = favoriteSide === "home" ? "away" : "home";
        const homeLine = favoriteSide === "home" ? -plusLine : plusLine;
        const row = findHandicapRow(match, homeLine);
        return Number(row?.[underdogSide]?.positive_probability || 0);
      }

      function strongestTacticalEdge(match, favoriteSide) {
        const edges = (match.matchup?.tactical_edges || [])
          .map((row) => ({
            label: row.label,
            edge: favoriteSide === "home" ? Number(row.home_edge || 0) : -Number(row.home_edge || 0),
            quality: row.data_quality || row.category || "unknown"
          }))
          .filter((row) => Number.isFinite(row.edge))
          .sort((a, b) => Math.abs(b.edge) - Math.abs(a.edge));
        return edges[0] || null;
      }

      function teamName(team) {
        const raw = team?.name || team?.team || "";
        return zhTeams[raw] || raw;
      }

      function bettingReferences(match) {
        return [
          oneXTwoReference(match),
          asianHandicapReference(match),
          europeanHandicapReference(match),
          polymarketHandicapReference(match),
          totalGoalsReference(match),
          scoreReference(match),
          cornersReference(match),
          cardsReference(match)
        ].map(applyReferenceGate);
      }

      function applyReferenceGate(row) {
        const gate = state.backtest?.formal?.public_reference_gate || {};
        const isHandicap = ["亚洲让球", "欧洲让球胜平负", "Polymarket 线型参考"].includes(row.category);
        const gateStatus = isHandicap ? gate.asian_handicap : row.category === "角球" ? gate.corners : null;
        if (!String(gateStatus || "").startsWith("suspended")) return row;
        return {
          ...row,
          source_type: "赛前锁定回测未通过",
          confidence: "低",
          pick: "已暂停方向输出",
          note: `该市场的真实赛前锁定成绩未通过准入门槛，当前只保留概率和数据展示。${row.note}`
        };
      }

      function outcomeRows(match) {
        return [
          { key: "home", label: `${match.home_team.name} 胜`, probability: Number(match.p_home || 0) },
          { key: "draw", label: "平局", probability: Number(match.p_draw || 0) },
          { key: "away", label: `${match.away_team.name} 胜`, probability: Number(match.p_away || 0) }
        ];
      }

      function rankedOutcomeRows(match) {
        return outcomeRows(match).sort((a, b) => b.probability - a.probability);
      }

      function oneXTwoSignal(match) {
        const rows = rankedOutcomeRows(match);
        const top = rows[0];
        const second = rows[1];
        const draw = rows.find((row) => row.key === "draw") || { probability: 0 };
        if (!top || !second) return null;
        const margin = top.probability - second.probability;
        const drawRisk = top.key !== "draw" && (draw.probability >= 0.30 || top.probability - draw.probability <= 0.18);
        const cutoff = top.key === "draw" ? 0.34 : 0.55;
        const recommend = top.probability >= cutoff && margin >= 0.10 && !drawRisk;
        let reason = `最高项 ${pct(top.probability)}，领先 ${signedPct(margin)}`;
        if (drawRisk) reason = `平局风险 ${pct(draw.probability)}，不硬站胜负`;
        else if (top.probability < cutoff) reason = `最高项未过 ${pct(cutoff)} 门槛`;
        else if (margin < 0.10) reason = `前两项差距只有 ${signedPct(margin)}`;
        return { ...top, margin, drawRisk, recommend, reason };
      }

      function totalGoalsSignal(match) {
        const over = Number(match.p_over_2_5);
        if (!Number.isFinite(over)) return null;
        const under = clamp(1 - over, 0, 1);
        const side = over >= under ? "over" : "under";
        const probability = Math.max(over, under);
        return {
          side,
          line: 2.5,
          probability,
          recommend: probability >= 0.60,
          label: side === "over" ? "大 2.5" : "小 2.5"
        };
      }

      function primaryHandicapSignal(match) {
        const favoriteSide = Number(match.p_home || 0) >= Number(match.p_away || 0) ? "home" : "away";
        const underdogSide = favoriteSide === "home" ? "away" : "home";
        const favoriteIsHome = favoriteSide === "home";
        const favorite = favoriteIsHome ? match.home_team.name : match.away_team.name;
        const underdog = favoriteIsHome ? match.away_team.name : match.home_team.name;
        const homeLine = favoriteIsHome ? -1.5 : 1.5;
        const favoriteProb = handicapProbability(match, homeLine, favoriteSide).probability;
        const underdogProb = handicapProbability(match, homeLine, underdogSide).probability;
        const pick = { side: favoriteSide, line: -1.5, label: `${favorite} -1.5`, probability: favoriteProb };
        return {
          ...pick,
          favorite,
          underdog,
          favoriteProb,
          underdogProb,
          recommend: Number.isFinite(favoriteProb) && favoriteProb >= 0.55
        };
      }

      function cornersSignal(match) {
        const corners = match.event_predictions?.corners || {};
        const over85 = Number(corners.over_8_5_probability);
        if (!Number.isFinite(over85)) return null;
        const under85 = clamp(1 - over85, 0, 1);
        const side = over85 >= under85 ? "over" : "under";
        const probability = Math.max(over85, under85);
        return {
          side,
          line: 8.5,
          probability,
          recommend: probability >= 0.60,
          label: side === "over" ? "角球大 8.5" : "角球小 8.5"
        };
      }

      function oneXTwoReference(match) {
        const status = matchTimingNote(match);
        const market = match.market_summary?.one_x_two || {};
        const outcomes = outcomeRows(match);
        const signal = oneXTwoSignal(match);
        const byDelta = outcomes
          .map((outcome) => ({
            ...outcome,
            marketProbability: Number(market.market_probabilities?.[outcome.key] ?? NaN),
            delta: Number(market.model_delta?.[outcome.key] ?? NaN)
          }))
          .filter((outcome) => Number.isFinite(outcome.delta))
          .sort((a, b) => b.delta - a.delta);
        const marketEdge = byDelta[0];
        const pick = market.status === "available" && marketEdge && marketEdge.delta >= 0.08 && signal?.recommend
          ? `模型高于市场：${marketEdge.label}`
          : signal?.recommend
            ? `高置信：${signal.label}`
            : `观察：${signal?.reason || "低置信"}`;
        const modelText = `${pct(match.p_home)} / ${pct(match.p_draw)} / ${pct(match.p_away)}`;
        const fairText = `${odds(fairOdds(match.p_home))} / ${odds(fairOdds(match.p_draw))} / ${odds(fairOdds(match.p_away))}`;
        const marketText = market.status === "available"
          ? `${pct(market.market_probabilities.home)} / ${pct(market.market_probabilities.draw)} / ${pct(market.market_probabilities.away)}`
          : fairText;
        const note = market.status === "available"
          ? `${status} 不让球胜平负是三结果市场，平局独立结算；市场为 ${market.source}，${market.books} 家去水均值。现在只有最高项过门槛且无明显平局风险才列入高置信参考。`
          : `${status} 不让球胜平负是三结果市场，平局不是退回本金；暂无真实 1X2 市场，显示模型公平赔率。现在会过滤低置信方向。`;
        return {
          category: "基础胜平负",
          source_type: market.status === "available" ? "模型 vs 1X2 市场" : "模型独立推导",
          confidence: signal?.recommend ? "中" : "低",
          pick,
          metric_a_label: "模型 主/平/客",
          metric_a: modelText,
          metric_b_label: market.status === "available" ? "市场去水 主/平/客" : "公平赔率 主/平/客",
          metric_b: marketText,
          note
        };
      }

      function asianHandicapReference(match) {
        const status = matchTimingNote(match);
        const candidates = [];
        (match.handicap_preview || []).forEach((row) => {
          if (row.market_status !== "available") return;
          const homeEdge = expectedReturnFromFair(row.home?.market_decimal_odds, row.home?.fair_decimal_odds);
          const awayEdge = expectedReturnFromFair(row.away?.market_decimal_odds, row.away?.fair_decimal_odds);
          if (homeEdge !== null) {
            candidates.push({
              side: `${match.home_team.name} ${line(row.line)}`,
              edge: homeEdge,
              probability: row.home.positive_probability,
              market: row.home.market_decimal_odds,
              fair: row.home.fair_decimal_odds,
              source: row.source
            });
          }
          if (awayEdge !== null) {
            candidates.push({
              side: `${match.away_team.name} ${line(-Number(row.line))}`,
              edge: awayEdge,
              probability: row.away.positive_probability,
              market: row.away.market_decimal_odds,
              fair: row.away.fair_decimal_odds,
              source: row.source
            });
          }
        });
        candidates.sort((a, b) => b.edge - a.edge);
        const best = candidates[0];
        if (!best || best.edge < 0.08) {
          const zero = findHandicapRow(match, 0);
          return {
            category: "亚洲让球",
            source_type: candidates.length ? "博彩公司市场对比" : "模型公平盘口",
            confidence: "低",
            pick: "观察",
            metric_a_label: "AH 0 主/客",
            metric_a: zero ? `${pct(zero.home.positive_probability)} / ${pct(zero.away.positive_probability)}` : "-",
            metric_b_label: "AH 0 走盘",
            metric_b: zero ? pct(zero.home.push) : "-",
            note: `${status} 当前没有超过 +8% 阈值的真实亚洲盘口。注意 AH 0 是平手盘，平局退回；它不等于三结果胜平负。`
          };
        }
        return {
          category: "亚洲让球",
          source_type: "博彩公司市场对比",
          confidence: "中",
          pick: `价格差异：${best.side}`,
          metric_a_label: "模型 edge",
          metric_a: signed(best.edge),
          metric_b_label: "覆盖 / 公平赔率",
          metric_b: `${pct(best.probability)} / ${odds(best.fair)}`,
          note: `${status} 亚洲盘按半赢、走盘、半输精确结算；市场 ${odds(best.market)} vs 模型公平 ${odds(best.fair)} · ${best.source}`
        };
      }

      function europeanHandicapReference(match) {
        const favoriteIsHome = Number(match.p_home || 0) >= Number(match.p_away || 0);
        const favorite = favoriteIsHome ? match.home_team.name : match.away_team.name;
        const opponent = favoriteIsHome ? match.away_team.name : match.home_team.name;
        const side = favoriteIsHome ? "home" : "away";
        const oneGoalRow = findHandicapRow(match, favoriteIsHome ? -1 : 1);
        const oneAndHalfRow = findHandicapRow(match, favoriteIsHome ? -1.5 : 1.5);
        const win = Number(oneAndHalfRow?.[side]?.positive_probability || 0);
        const draw = Number(oneGoalRow?.[side]?.push || 0);
        const lose = clamp(1 - win - draw, 0, 1);
        const pick = win >= 0.45
          ? `${favorite} -1 让胜`
          : draw >= 0.25
            ? `${favorite} -1 让平观察`
            : `${opponent} 受让方向观察`;
        return {
          category: "欧洲让球胜平负",
          source_type: "模型独立推导",
          confidence: "高",
          pick,
          metric_a_label: `${favorite} -1 后`,
          metric_a: `${pct(win)} / ${pct(draw)} / ${pct(lose)}`,
          metric_b_label: "结算结构",
          metric_b: "让胜 / 让平 / 让负",
          note: `${matchTimingNote(match)} 欧洲让球是三结果市场：以 ${favorite} -1 为例，赢 2+ 球才是让胜，赢 1 球是让平，其余为让负。`
        };
      }

      function polymarketHandicapReference(match) {
        const favoriteIsHome = Number(match.p_home || 0) >= Number(match.p_away || 0);
        const favorite = favoriteIsHome ? match.home_team.name : match.away_team.name;
        const underdog = favoriteIsHome ? match.away_team.name : match.home_team.name;
        const minus15 = handicapProbability(match, favoriteIsHome ? -1.5 : 1.5, favoriteIsHome ? "home" : "away");
        const minus25 = handicapProbability(match, favoriteIsHome ? -2.5 : 2.5, favoriteIsHome ? "home" : "away");
        const plus15 = handicapProbability(match, favoriteIsHome ? -1.5 : 1.5, favoriteIsHome ? "away" : "home");
        const plus25 = handicapProbability(match, favoriteIsHome ? -2.5 : 2.5, favoriteIsHome ? "away" : "home");
        const signal = primaryHandicapSignal(match);
        const secondaryPick = minus25.probability >= plus25.probability ? `${favorite} -2.5` : `${underdog} +2.5`;
        return {
          category: "Polymarket 线型参考",
          source_type: "模型独立推导",
          confidence: signal?.recommend ? "中" : "低",
          pick: signal?.recommend ? `${signal.label} / ${secondaryPick}` : "仅展示概率：受让 +1.5 不给方向",
          metric_a_label: `${favorite} -1.5 / -2.5`,
          metric_a: `${pct(minus15.probability)} / ${pct(minus25.probability)}`,
          metric_b_label: `${underdog} +1.5 / +2.5`,
          metric_b: `${pct(plus15.probability)} / ${pct(plus25.probability)}`,
          note: `${matchTimingNote(match)} 这里只是适配 Polymarket 常见 1.5、2.5 线型；当前未读取对应合约价格，因此不是 Polymarket 定价信号。近期复盘显示弱队 +1.5 尾部风险被低估，暂不输出受让方向。`
        };
      }

      function handicapProbability(match, homeLine, side) {
        const row = (match.handicap_preview || []).find((item) => Number(item.line) === Number(homeLine));
        return {
          probability: Number(row?.[side]?.positive_probability || 0),
          fair: row?.[side]?.fair_decimal_odds || null
        };
      }

      function scoreReference(match) {
        const scorelines = match.event_predictions?.score?.top_scorelines || match.top_scorelines || [];
        const top = scorelines[0];
        const alternatives = scorelines.slice(1, 3).map((row) => `${row.score} ${pct(row.probability)}`).join(" · ");
        return {
          category: "比分",
          source_type: "模型独立推导",
          confidence: "中",
          pick: top ? top.score : "观察",
          metric_a_label: "首选概率",
          metric_a: top ? pct(top.probability) : "-",
          metric_b_label: "备选比分",
          metric_b: alternatives || "-",
          note: `${matchTimingNote(match)} 精确比分天然波动大，建议只当比分分布参考。`
        };
      }

      function totalGoalsReference(match) {
        const market = match.market_summary?.over_under_2_5 || {};
        const over = Number(match.p_over_2_5 || 0);
        const under = clamp(1 - over, 0, 1);
        const signal = totalGoalsSignal(match);
        const marketOver = Number(market.market_probabilities?.over ?? NaN);
        const marketUnder = Number(market.market_probabilities?.under ?? NaN);
        const overDelta = Number(market.model_delta?.over ?? NaN);
        const underDelta = Number(market.model_delta?.under ?? NaN);
        const pick = market.status === "available" && Math.max(overDelta, underDelta) >= 0.08 && signal?.recommend
          ? `模型高于市场：${overDelta >= underDelta ? "大 2.5" : "小 2.5"}`
          : signal?.recommend ? signal.label : "观察：大/小 2.5 未过 60% 门槛";
        return {
          category: "大小球",
          source_type: market.status === "available" ? "模型 vs O/U 市场" : "模型独立推导",
          confidence: signal?.recommend ? "中" : "低",
          pick,
          metric_a_label: "模型 大/小 2.5",
          metric_a: `${pct(over)} / ${pct(under)}`,
          metric_b_label: market.status === "available" ? "市场去水 大/小" : "公平赔率 大/小",
          metric_b: market.status === "available" ? `${pct(marketOver)} / ${pct(marketUnder)}` : `${odds(fairOdds(over))} / ${odds(fairOdds(under))}`,
          note: market.status === "available"
            ? `${matchTimingNote(match)} 基于比分矩阵总进球分布，并与 ${market.books} 家 O/U 2.5 市场去水均值对比；低于 60% 或 edge 低于 8% 时只展示，不列入参考。`
            : `${matchTimingNote(match)} 基于比分矩阵总进球分布；未接入真实 O/U 2.5 市场 edge 时只显示模型方向，低于 60% 不硬推。`
        };
      }

      function cornersReference(match) {
        const corners = match.event_predictions?.corners || {};
        const over85 = Number(corners.over_8_5_probability || 0);
        const over95 = Number(corners.over_9_5_probability || 0);
        const signal = cornersSignal(match);
        let pick = "角球观察";
        if (over95 >= 0.60) pick = "角球大 9.5";
        else if (signal?.recommend) pick = signal.label;
        return {
          category: "角球",
          source_type: "代理数据低置信",
          confidence: signal?.recommend || over95 >= 0.60 ? "中" : "低",
          pick,
          metric_a_label: "角球预测 主/客",
          metric_a: `${value(corners.home_expected, 1)} / ${value(corners.away_expected, 1)}`,
          metric_b_label: "大 8.5 / 大 9.5",
          metric_b: `${pct(over85)} / ${pct(over95)}`,
          note: `${matchTimingNote(match)} 角球来自技术统计代理和实时公开统计校验；缺少真实角球盘口与球队角球历史回测，只有大/小 8.5 过 60% 才给参考。`
        };
      }

      function cardsReference(match) {
        const cards = match.event_predictions?.cards || {};
        const yellow35 = Number(cards.over_3_5_yellow_probability || 0);
        const yellow45 = Number(cards.over_4_5_yellow_probability || 0);
        const red = Number(cards.any_red_probability || 0);
        let yellowPick = "黄牌观察";
        if (yellow45 >= 0.55) yellowPick = "黄牌大 4.5";
        else if (yellow35 >= 0.55) yellowPick = "黄牌大 3.5";
        else if (yellow35 <= 0.45) yellowPick = "黄牌小 3.5";
        const redPick = red >= 0.18 ? "红牌风险偏高" : red <= 0.08 ? "红牌偏低" : "红牌观察";
        return {
          category: "红黄牌",
          source_type: "代理数据低置信",
          confidence: "低",
          pick: `${yellowPick} / ${redPick}`,
          metric_a_label: "黄牌大 3.5",
          metric_a: pct(yellow35),
          metric_b_label: "出现红牌",
          metric_b: pct(red),
          note: `${matchTimingNote(match)} 黄/红牌来自透明先验和实时公开统计校验，缺少裁判尺度与真实牌市场赔率。`
        };
      }

      function expectedReturnFromFair(marketOdds, fairOdds) {
        const market = Number(marketOdds);
        const fair = Number(fairOdds);
        if (!Number.isFinite(market) || !Number.isFinite(fair) || market <= 1 || fair <= 1) return null;
        return market / fair - 1;
      }

      function matchTimingNote(match) {
        const live = match.live_status;
        if (!live || live.status_state === "pre") return "赛前参考。";
        if (live.completed || live.status_state === "post") return "已完赛，仅作复盘。";
        return "比赛进行中，仅作实时研究参考。";
      }

      function currentWinProjection(match) {

      function asianHandicapMarketPerformance(matches) {

      function primaryHandicapSelection(match) {
        const favoriteSide = Number(match.p_home || 0) >= Number(match.p_away || 0) ? "home" : "away";
        const underdogSide = favoriteSide === "home" ? "away" : "home";
        const homeLine = favoriteSide === "home" ? -1.5 : 1.5;
        const favoriteLine = findHandicapRow(match, homeLine);
        const favoriteProbability = Number(favoriteLine?.[favoriteSide]?.positive_probability);
        if (Number.isFinite(favoriteProbability) && favoriteProbability >= 0.5) {
          return { side: favoriteSide, line: -1.5 };
        }
        return { side: underdogSide, line: 1.5 };
      }

      function asianHandicapSelection(match) {
        const candidates = [];
        (match.handicap_preview || []).forEach((row) => {
          if (row.market_status !== "available") return;
          const homeEdge = expectedReturnFromFair(row.home?.market_decimal_odds, row.home?.fair_decimal_odds);
          const awayEdge = expectedReturnFromFair(row.away?.market_decimal_odds, row.away?.fair_decimal_odds);
          if (homeEdge !== null) candidates.push({ side: "home", line: Number(row.line), edge: homeEdge });
          if (awayEdge !== null) candidates.push({ side: "away", line: -Number(row.line), edge: awayEdge });
        });
        candidates.sort((a, b) => b.edge - a.edge);
        return candidates[0]?.edge >= 0.08 ? candidates[0] : null;
      }

      function booleanPerformance(rows) {
        const correct = rows.filter((row) => row.correct).length;
        return {
          samples: rows.length,
          correct,
          hit_rate: rows.length ? correct / rows.length : null

      function settleAsianHandicap(margin, lineValue) {
        const lineNumber = Number(lineValue);
        const scaled = Math.round(lineNumber * 4);
        if (scaled % 2 === 0) return settleHalfLine(margin, lineNumber);
        const base = lineNumber >= 0 ? Math.floor(lineNumber * 2) / 2 : Math.ceil(lineNumber * 2) / 2;
        const other = lineNumber >= 0 ? base + 0.5 : base - 0.5;
        const score = settlementScore(settleHalfLine(margin, base)) + settlementScore(settleHalfLine(margin, other));
        if (score === 2) return "win";
        if (score === 1) return "half_win";
        if (score === 0) return "push";
        if (score === -1) return "half_loss";
        return "loss";
      }

      function settleHalfLine(margin, lineValue) {
        const adjusted = Number(margin) + Number(lineValue);
        if (adjusted > 0) return "win";
        if (adjusted === 0) return "push";
        return "loss";
      }

      function settlementScore(settlement) {
        if (settlement === "win") return 1;
        if (settlement === "push") return 0;
        return -1;

      function cornersPerformance(matches) {

          .map((match) => {

            if (actualTotal === null) return null;

            if (!selection) return null;

          samples: rows.length,

          .map((match) => {

            if (!selection) return null;
            const correct = selection.side === "over" ? actualTotal > selection.line : actualTotal < selection.line;
            return { correct };

          .filter(Boolean);
        const correct = rows.filter((row) => row.correct).length;
        return {
          samples: rows.length,
          correct,
          hit_rate: rows.length ? correct / rows.length : null
        };
      }

      function actualTotalCorners(match) {
        const corners = match.event_predictions?.corners || {};
        const home = corners.live_home ?? match.live_status?.home_stats?.corners;
        const away = corners.live_away ?? match.live_status?.away_stats?.corners;
        if (home === null || home === undefined || away === null || away === undefined) return null;
        return Number(home) + Number(away);
      }

      function cornerDirectionSelection(match) {
        const corners = match.event_predictions?.corners || {};
        const over85 = Number(corners.over_8_5_probability);
        if (!Number.isFinite(over85)) return null;
        return over85 >= 0.5 ? { side: "over", line: 8.5 } : { side: "under", line: 8.5 };
      }

      function cornerSelection(match) {
        const corners = match.event_predictions?.corners || {};
        const over85 = Number(corners.over_8_5_probability);
        const over95 = Number(corners.over_9_5_probability);
        if (Number.isFinite(over95) && over95 >= 0.60) return { side: "over", line: 9.5 };
        if (Number.isFinite(over85) && over85 >= 0.60) return { side: "over", line: 8.5 };
        if (Number.isFinite(over85) && over85 <= 0.40) return { side: "under", line: 8.5 };
        return null;
      }

      function actualOutcome(match) {
        const live = match.live_status;
        if (!live || !(live.completed || live.status_state === "post") || !hasActualScore(match)) return null;
        const home = Number(live.home_score);
        const away = Number(live.away_score);
        if (home > away) return "home";
        if (home < away) return "away";
        return "draw";
      }

      function predictedOutcome(match) {
        const rows = [
          { outcome: "home", probability: Number(match.p_home || 0) },
          { outcome: "draw", probability: Number(match.p_draw || 0) },
          { outcome: "away", probability: Number(match.p_away || 0) }
        ].sort((a, b) => b.probability - a.probability);
        return rows[0].outcome;
      }

      function currentLeaderText(match, current) {
        const rows = [
          { label: match.home_team.name, probability: current.home },
          { label: "平局", probability: current.draw },
          { label: match.away_team.name, probability: current.away }
        ].sort((a, b) => b.probability - a.probability);
        return {
          value: `${rows[0].label} ${pct(rows[0].probability)}`,
          sub: current.label
        };
      }

      function finalWinProjection(homeScore, awayScore) {
        if (homeScore > awayScore) return { home: 1, draw: 0, away: 0, label: "完赛", note: "比赛已结束，当前胜率等同于赛果。" };
        if (homeScore < awayScore) return { home: 0, draw: 0, away: 1, label: "完赛", note: "比赛已结束，当前胜率等同于赛果。" };
        return { home: 0, draw: 1, away: 0, label: "完赛", note: "比赛已结束，当前胜率等同于赛果。" };
      }

      function remainingOutcomeProjection(homeScore, awayScore, homeLambda, awayLambda) {
        const maxExtraGoals = 7;
        const homePmfs = poissonDistribution(homeLambda, maxExtraGoals);
        const awayPmfs = poissonDistribution(awayLambda, maxExtraGoals);
        let home = 0;
        let draw = 0;
        let away = 0;
        for (let h = 0; h < homePmfs.length; h += 1) {
          for (let a = 0; a < awayPmfs.length; a += 1) {
            const probability = homePmfs[h] * awayPmfs[a];
            const finalHome = homeScore + h;
            const finalAway = awayScore + a;
            if (finalHome > finalAway) home += probability;
            else if (finalHome === finalAway) draw += probability;
            else away += probability;
          }
        }
        const total = Math.max(0.000001, home + draw + away);
        return { home: home / total, draw: draw / total, away: away / total };
      }

      function poissonDistribution(lambda, maxGoals) {
        const values = [];
        let probability = Math.exp(-lambda);
        let total = 0;
        for (let goals = 0; goals <= maxGoals; goals += 1) {
          if (goals > 0) probability *= lambda / goals;
          values.push(probability);
          total += probability;
        }
        return values.map((value) => value / total);
      }

      function liveMinute(live) {
        const clock = String(live.display_clock || "");
        const match = clock.match(/(\d+)/);
        if (match) return clamp(Number(match[1]), 0, 98);
        if (Number(live.period) >= 2) return 75;
        if (Number(live.period) === 1) return 30;
        return 45;
      }

      function clamp(value, low, high) {
        return Math.max(low, Math.min(high, value));
      }

      function fatigueText(value) {
        if (value === "very_high") return "极高";
        if (value === "high") return "高";
        if (value === "medium") return "中";
        return "低";
      }

      function scoreOrProbability(match, side) {
        if (match.live_status && match.live_status[`${side}_score`] !== null && match.live_status[`${side}_score`] !== undefined) {
          return match.live_status[`${side}_score`];
        }
        return pct(side === "home" ? match.p_home : match.p_away);
      }

      function scoreLens(match) {
        if (hasActualScore(match)) {
          return `${match.live_status.home_score} : ${match.live_status.away_score}`;
        }
        return `${match.lambda_home.toFixed(2)} : ${match.lambda_away.toFixed(2)}`;
      }

      function hasActualScore(match) {
        return match.live_status && match.live_status.home_score !== null && match.live_status.home_score !== undefined && match.live_status.away_score !== null && match.live_status.away_score !== undefined;
      }

      function liveLabel(match) {
        const live = match.live_status;
        if (!live) return "模型赛前";
        if (live.completed) return "FT";
        if (live.status_state === "in") return `LIVE ${live.display_clock || ""}`.trim();
        if (live.status_state === "pre") return "赛前";
        return live.status_description || live.status_state || "赛程";
      }

      function renderTournament() {
        const teams = state.tournament?.teams || [];
        const anchor = state.tournament?.title_anchor;
        document.getElementById("sim-count").textContent = `${state.tournament?.projected_matches_total || 104} match path`;
        const titleRows = teams.slice(0, 10).map((item, index) => `
          <div class="title-row">
            <span class="muted">${index + 1}</span>
            ${flag({ flag_code: item.flag_code, name: item.team })}
            <div class="title-team">
              <strong>${item.team}</strong>
              <em>最终 ${pct(item.title_probability)} · MC裸模型 ${pct(item.raw_title_probability)} · 四强 ${pct(item.reach_sf)} · 决赛 ${pct(item.reach_final)}${item.market_probability == null ? " · 暂无市场" : ` · 市场 ${pct(item.market_probability)}`}${item.model_market_delta == null ? "" : ` · 裸差 ${signed(item.model_market_delta)}`}</em>
            </div>
            <div class="mini"><i style="width:${Math.max(2, item.title_probability * 100)}%"></i></div>
            <span class="mono">${pct(item.title_probability)}</span>
          </div>
        `).join("");
        const bracket = bracketBoard(state.tournament?.bracket);
        document.getElementById("tournament").innerHTML = `
          <div class="subpanel" style="margin:12px">
            <span class="data-chip">${anchor?.source || "market"} · 覆盖 ${anchor?.coverage || 0} 队 · 锚定 ${pct(anchor?.weight || 0)}</span>
            <p class="source-note">${state.tournament?.data_quality || ""} · Monte Carlo ${Number(state.tournament?.monte_carlo?.n_simulations || 0).toLocaleString()} 次 · seed ${state.tournament?.monte_carlo?.seed || "-"}</p>
          </div>
          ${titleRows}
          ${goalScale(state.tournament?.goal_scale_sanity)}
          ${marketValidation(state.tournament?.market_validation)}
          ${bracket}
        `;
      }

      function goalScale(goalScale) {
        if (!goalScale) return "";
        return `
          <div class="subpanel" style="margin:12px">
            <span class="data-chip">进球尺度 ${goalScale.average_goals_per_match} 球/场 · 预计总进球 ${goalScale.estimated_tournament_goals}</span>
            <p class="source-note">金靴 sanity band ${goalScale.golden_boot_goal_band} 球 · ${goalScale.status}</p>
          </div>
        `;
      }

      function marketValidation(validation) {
        if (!validation) return "";
        return `
          <div class="subpanel" style="margin:12px">
            <span class="data-chip">盘口闭盘验证：${validation.true_market_line_status}</span>
            <p class="source-note">legal AH ${validation.legal_asian_handicap_rows || 0} · proxy AH ${validation.proxy_asian_handicap_rows || 0} · closing ${validation.closing_line_status} · CLV ${validation.clv_status}</p>
          </div>
        `;
      }

      function renderBacktest() {
        const report = state.backtest || {};
        const counts = report.snapshot_counts || {};
        const formal = report.formal || {};
        const shadow = report.shadow || {};
        const formalOneXTwo = formal.one_x_two || {};
        const formalAsian = formal.asian_handicap || {};
        const formalOverUnder = formal.over_under || {};
        const formalCorners = formal.corners || {};
        const shadowOneXTwo = shadow.one_x_two || {};
        const shadowAsian = shadow.asian_handicap || {};
        const shadowOverUnder = shadow.over_under || {};
        const shadowCorners = shadow.corners || {};
        const comparison = report.model_comparison || {};
        const factorGate = report.factor_gate || {};
        document.getElementById("backtest-status").textContent = report.status ? "MVP" : "pending";
        document.getElementById("backtest").innerHTML = `
          <div class="subpanel" style="margin:12px">
            <span class="data-chip">赛前锁定验证 · 闭盘线待补 · 非投注建议</span>
            <p class="source-note">${report.method || "等待快照生成"} </p>
          </div>
          <div class="grid" style="padding:0 12px 12px">
            ${tile("锁定预测", counts.model_prediction_snapshots ?? "-")}
            ${tile("赛前锁定", counts.eligible_pre_kickoff_predictions ?? "-")}
            ${tile("闭盘快照", counts.true_closing_lines ?? 0)}
            ${tile("已结算比赛", counts.settled_matches ?? 0)}
            ${tile("1X2 命中", performanceText(formalOneXTwo))}
            ${tile("让球 ROI", pctOrDash(formalAsian.roi))}
            ${tile("大小球命中", performanceText(formalOverUnder))}
            ${tile("角球命中", performanceText(formalCorners))}
          </div>
          <div class="subpanel" style="margin:0 12px 12px">
            <h3>正式赛前锁定成绩</h3>
            <div class="rail-body" style="padding:10px 0 0">
              ${performanceRow("样本", `${formal.eligible_samples || 0} 场`, "必须赛前锁定，且不能偷看未来")}
              ${performanceRow("不让球 1X2", performanceText(formalOneXTwo), `Brier ${metricNumber(formalOneXTwo.brier)} · log-loss ${metricNumber(formalOneXTwo.log_loss)}`)}
              ${performanceRow("亚洲让球", performanceText(formalAsian), `ROI ${pctOrDash(formalAsian.roi)} · CLV ${pctOrDash(formalAsian.average_clv)}`)}
              ${performanceRow("大小球", performanceText(formalOverUnder), `Brier ${metricNumber(formalOverUnder.brier)} · O/U 2.5`)}
              ${performanceRow("角球", performanceText(formalCorners), `真实角球样本 ${formalCorners.actual_event_samples || 0} 场`)}
              ${performanceRow("公开方向闸门", referenceGateText(formal.public_reference_gate), "未通过的市场只显示概率，不再输出方向")}
            </div>
            <p class="source-note">${(formal.notes || []).join(" ") || "等待第一批真实赛前锁定与闭盘样本。"}</p>
          </div>
          <div class="subpanel" style="margin:0 12px 12px">
            <h3>影子审计</h3>
            <div class="rail-body" style="padding:10px 0 0">
              ${performanceRow("用途", shadow.label || "公式烟测", "不作为专业模型成绩")}
              ${performanceRow("不让球 1X2", performanceText(shadowOneXTwo), `Brier ${metricNumber(shadowOneXTwo.brier)} · log-loss ${metricNumber(shadowOneXTwo.log_loss)}`)}
              ${performanceRow("亚洲让球", performanceText(shadowAsian), `走盘 ${shadowAsian.pushes || 0} · ROI ${pctOrDash(shadowAsian.roi)}`)}
              ${performanceRow("大小球", performanceText(shadowOverUnder), `Brier ${metricNumber(shadowOverUnder.brier)} · O/U 2.5`)}
              ${performanceRow("角球", performanceText(shadowCorners), `真实角球样本 ${shadowCorners.actual_event_samples || 0} 场`)}
            </div>
          </div>
          ${modelComparisonPanel(comparison)}
          ${factorGatePanel(factorGate)}
        `;
      }

      function modelComparisonPanel(comparison) {
        if (!comparison || !comparison.samples) return "";
        const baseline = comparison.baseline || {};
        const ensemble = comparison.production_ensemble || {};
        const market = comparison.market_consensus || {};
        const dixonColes = comparison.dixon_coles || {};
        return `
          <div class="subpanel" style="margin:0 12px 12px">
            <h3>模型候选并行评测</h3>
            <div class="rail-body" style="padding:10px 0 0">
              ${performanceRow("裸多因子模型", performanceText(baseline), `Brier ${metricNumber(baseline.brier)} · log-loss ${metricNumber(baseline.log_loss)}`)}
              ${performanceRow("当前生产融合", performanceText(ensemble), `市场权重 ${pct(ensemble.market_weight || 0)} · Brier ${metricNumber(ensemble.brier)} · log-loss ${metricNumber(ensemble.log_loss)}`)}
              ${performanceRow("去水市场共识", performanceText(market), `仅统计有真实赛前赔率的 ${market.samples || 0} 场`)}
              ${performanceRow("Dixon-Coles", performanceText(dixonColes), `rho ${value(dixonColes.rho, 2)} · log-loss ${metricNumber(dixonColes.log_loss)}`)}
              ${performanceRow("升级判定", modelDecisionText(comparison.decision), `log-loss 差 ${signedMetric(comparison.delta_log_loss)} · 样本 ${comparison.samples}`)}
            </div>
            <p class="source-note">${comparison.promotion_rule || "候选模型必须 walk-forward 优于 baseline 才能提升权重。"}</p>
          </div>
        `;
      }

      function factorGatePanel(factorGate) {
        if (!factorGate?.categories?.length) return "";
        return `
          <div class="subpanel" style="margin:0 12px 12px">
            <h3>因子准入门控</h3>
            <div class="rail-body" style="padding:10px 0 0">
              ${factorGate.categories.map((row) => performanceRow(
                row.category,
                `${row.factor_count} 类`,
                `入模 ${row.used_in_model_rows} · 展示 ${row.display_only_rows} · 代理 ${row.proxy_rows}`
              )).join("")}
            </div>
            <p class="source-note">${factorGate.policy || "代理因子先展示，回测有效后再入模。"}</p>
          </div>
        `;
      }

      function performanceText(report) {
        const samples = Number(report?.samples ?? report?.selections ?? 0);
        if (!samples || report?.hit_rate === null || report?.hit_rate === undefined) return "pending";
        return `${pct(report.hit_rate)} · ${Number(report.correct || 0)}/${samples}`;
      }

      function performanceRow(label, value, note) {
        return `
          <div class="source">
            <div><strong>${label}</strong><span>${note}</span></div>
            <em>${value}</em>
          </div>
        `;
      }

      function pctOrDash(value) {
        return value === null || value === undefined || Number.isNaN(value) ? "-" : pct(value);
      }

      function metricNumber(value) {
        return value === null || value === undefined || Number.isNaN(value) ? "-" : Number(value).toFixed(3);
      }

      function signedMetric(value) {
        if (value === null || value === undefined || Number.isNaN(value)) return "-";
        return `${Number(value) >= 0 ? "+" : ""}${Number(value).toFixed(3)}`;
      }

      function modelDecisionText(decision) {
        if (decision === "promote_market_ensemble") return "启用市场融合";
        if (decision === "promote_candidate_after_more_samples") return "候选占优";
        if (decision === "keep_raw_model") return "保留裸模型";
        return "继续观察";
      }

      function referenceGateText(gate) {
        if (!gate) return "pending";
        const suspended = [gate.asian_handicap, gate.corners].filter((value) => String(value || "").startsWith("suspended")).length;
        return suspended ? `暂停 ${suspended} 类市场` : "研究展示";
      }

      function bracketBoard(bracket) {
        if (!bracket?.rounds?.length) return "";
        const rounds = bracket.rounds.filter((round) => ["R32", "R16", "QF", "SF", "Final"].includes(round.round));
        return `
          <div class="bracket-board">
            <div class="subpanel">
              <span class="data-chip">路径冠军：${bracket.champion?.team || "-"}</span>
              <p class="source-note">${bracket.source || ""}</p>
            </div>
            ${rounds.map((round) => `
              <div class="bracket-round">
                <h3>${round.label}</h3>
                ${round.matches.slice(0, round.round === "R32" ? 4 : 8).map((match) => `
                  <div class="path-row">
                    <span class="mono">#${match.match_number}</span>
                    <strong>${match.home.team}</strong>
                    <span class="muted">vs</span>
                    <strong>${match.away.team}</strong>
                    <span class="mono">${pct(match.winner_probability)}</span>
                  </div>
                `).join("")}
              </div>
            `).join("")}
          </div>
        `;
      }

      function renderSources() {
        document.getElementById("source-count").textContent = `${state.sources.length} sources`;
        document.getElementById("sources").innerHTML = state.sources.map((source) => `
          <div class="source">
            <div><strong>${source.source}</strong><span>${source.purpose} · ${source.freshness || "unknown freshness"}</span></div>
            <em>${source.status}</em>
          </div>
        `).join("");
      }

      function confidenceScore(match) {
        const backendScore = Number(match.confidence_profile?.score);
        if (Number.isFinite(backendScore) && backendScore > 0) return backendScore;
        const marketShare = match.handicap_preview.filter((row) => row.market_status === "available").length / Math.max(1, match.handicap_preview.length);
        const realFactors = match.factor_breakdown.filter((factor) => factor.used_in_model && factor.data_quality !== "proxy").length / Math.max(1, match.factor_breakdown.length);
        const proxyPenalty = match.factor_breakdown.some((factor) => !factor.used_in_model) ? 0.05 : 0;
        const injuryPenalty = Math.min(0.12, match.home_team.injury_impact + match.away_team.injury_impact);
        return Math.max(0.45, Math.min(0.91, 0.58 + marketShare * 0.18 + realFactors * 0.16 - proxyPenalty - injuryPenalty));
      }

      function shortTime(value) {
        try {
          return new Date(value).toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
        } catch (_error) {
          return value;
        }
      }

      boot();
    </script>
  </body>
</html>
