<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2026 World Cup Prediction Dashboard</title>
    <style>
      :root {
        --bg: #f2f4f7;
        --surface: rgba(255, 255, 255, 0.88);
        --solid: #ffffff;
        --soft: #eef2f7;
        --ink: #121721;
        --muted: #687386;
        --line: rgba(125, 139, 158, 0.24);
        --blue: #1d4ed8;
        --cyan: #0891b2;
        --green: #12805c;
        --red: #c2384d;
        --amber: #b7791f;
        --shadow: 0 18px 46px rgba(20, 31, 48, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(242, 244, 247, 0.96) 320px),
          radial-gradient(circle at top left, rgba(29, 78, 216, 0.1), transparent 370px),
          linear-gradient(120deg, rgba(8, 145, 178, 0.1), rgba(255, 255, 255, 0) 48%);
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .shell {
        width: min(1560px, 100%);
        margin: 0 auto;
        padding: 20px;
      }

      .deck,
      .controls,
      .metrics,
      .workspace,
      .lower {
        margin-bottom: 14px;
      }

      .deck,
      .controls,
      .metric,
      .panel,
      .match-list,
      .detail,
      .rail {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .deck {
        min-height: 120px;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      .brand {
        display: flex;
        gap: 14px;
        align-items: center;
      }

      .mark {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--solid);
        color: var(--blue);
        font-weight: 900;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: var(--blue);
        font-size: 12px;
        font-weight: 850;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(28px, 4vw, 44px);
        line-height: 1.02;
      }

      .copy {
        margin-top: 8px;
        color: var(--muted);
        line-height: 1.6;
      }

      .hosts,
      .badges,
      .team-line,
      .inline-team,
      .tabs,
      .venue,
      .availability-head,
      .weather-grid {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .hosts {
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .host {
        min-width: 92px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.76);
      }

      .host strong,
      .host span,
      .metric span,
      .metric small {
        display: block;
      }

      .host span,
      .metric span,
      .metric small,
      .muted,
      .match-meta,
      .source span,
      .tile span,
      .factor em,
      .player em {
        color: var(--muted);
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px;
      }

      .search {
        width: min(470px, 100%);
        height: 42px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--solid);
      }

      .search input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
      }

      .segments,
      .tabs {
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
        overflow-x: auto;
      }

      .segments button,
      .tabs button {
        height: 32px;
        min-width: 42px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        white-space: nowrap;
      }

      .segments button.active,
      .tabs button.active {
        background: var(--solid);
        color: var(--ink);
        box-shadow: 0 1px 5px rgba(24, 34, 48, 0.1);
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
      }

      .metric {
        min-height: 112px;
        padding: 14px;
      }

      .metric b {
        display: block;
        margin-top: 8px;
        font-size: 25px;
      }

      .workspace {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr) 360px;
        gap: 14px;
        align-items: start;
      }

      .match-list,
      .detail,
      .rail,
      .panel {
        overflow: hidden;
      }

      .detail {
        padding: 14px;
      }

      .head {
        min-height: 48px;
        padding: 0 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid var(--line);
      }

      .head span {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
      }

      .match-row {
        width: 100%;
        padding: 13px 14px;
        display: grid;
        gap: 8px;
        text-align: left;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.38);
        color: var(--ink);
      }

      .match-row.active,
      .match-row:hover {
        background: rgba(255, 255, 255, 0.86);
      }

      .match-row.active {
        box-shadow: inset 3px 0 0 var(--blue);
      }

      .match-view-tabs {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
        padding: 10px;
        border-bottom: 1px solid var(--line);
      }

      .match-view-tabs button {
        min-height: 34px;
        border: 0;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.45);
        color: var(--muted);
        font-size: 12px;
        font-weight: 850;
      }

      .match-view-tabs button.active {
        background: var(--solid);
        color: var(--ink);
      }

      #match-list {
        max-height: calc(100vh - 260px);
        overflow-y: auto;
      }

      .match-section-title,
      .match-empty {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        font-weight: 900;
      }

      .match-section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(255, 255, 255, 0.42);
      }

      .team-line {
        justify-content: space-between;
      }

      .badges {
        flex-wrap: wrap;
      }

      .badge,
      .risk,
      .lean,
      .note {
        display: inline-flex;
        min-height: 24px;
        align-items: center;
        padding: 0 8px;
        border-radius: 7px;
        font-size: 12px;
        font-weight: 850;
        background: #e6edf5;
        color: #31516f;
      }

      .flag {
        width: 25px;
        height: 17px;
        object-fit: cover;
        flex: 0 0 auto;
        border: 1px solid rgba(18, 23, 33, 0.14);
        border-radius: 4px;
        background: var(--soft);
      }

      .flag.big {
        width: 54px;
        height: 36px;
      }

      .hero {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.94), rgba(239, 244, 250, 0.86));
      }

      .hero h2 {
        margin-top: 4px;
        font-size: clamp(24px, 3vw, 38px);
        line-height: 1.05;
      }

      .venue {
        margin-top: 10px;
        color: var(--muted);
        line-height: 1.5;
      }

      .score-lens {
        min-width: 250px;
        padding: 10px;
        display: grid;
        grid-template-columns: 54px minmax(110px, 1fr) 54px;
        gap: 10px;
        align-items: center;
        text-align: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.74);
      }

      .score-lens strong {
        display: block;
        font-size: 25px;
        font-variant-numeric: tabular-nums;
      }

      .prob {
        margin: 14px 0;
      }

      .prob-labels {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .prob-labels span:nth-child(2) {
        text-align: center;
      }

      .prob-labels span:nth-child(3) {
        text-align: right;
      }

      .prob-bar {
        height: 18px;
        display: flex;
        overflow: hidden;
        border-radius: 6px;
        background: var(--soft);
      }

      .home { background: var(--blue); }
      .draw { background: var(--amber); }
      .away { background: var(--green); }

      .table-wrap {
        width: 100%;
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--solid);
      }

      table {
        width: 100%;
        min-width: 850px;
        border-collapse: collapse;
        font-size: 14px;
      }

      th,
      td {
        padding: 11px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-size: 12px;
        font-weight: 850;
        background: #f7f9fc;
        white-space: nowrap;
      }

      td small {
        display: block;
        margin-top: 3px;
        color: var(--muted);
      }

      .mono {
        font-variant-numeric: tabular-nums;
        font-family: "SF Mono", Consolas, ui-monospace, monospace;
      }

      .lean.home-lean {
        color: #123f91;
        background: #dce8ff;
      }

      .lean.away-lean {
        color: #075c3b;
        background: #d9fbe8;
      }

      .tabs {
        width: fit-content;
        max-width: 100%;
        margin-bottom: 12px;
      }

      .grid,
      .split,
      .rail-body {
        display: grid;
        gap: 10px;
      }

      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .tech-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-top: 10px;
      }

      .split {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .tile,
      .subpanel {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fafc;
      }

      .tile strong {
        display: block;
        margin-top: 6px;
        line-height: 1.35;
      }

      .factor {
        display: grid;
        grid-template-columns: minmax(120px, 1fr) minmax(120px, 1fr) 52px;
        gap: 10px;
        align-items: center;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.72);
      }

      .track {
        height: 10px;
        display: grid;
        grid-template-columns: 1fr 2px 1fr;
        overflow: hidden;
        border-radius: 5px;
        background: var(--soft);
      }

      .track b {
        background: rgba(18, 23, 33, 0.24);
      }

      .edge-away {
        justify-self: end;
        height: 100%;
        background: var(--green);
      }

      .edge-home {
        justify-self: start;
        height: 100%;
        background: var(--blue);
      }

      .rail {
        padding-bottom: 12px;
      }

      .rail-body {
        padding: 12px;
      }

      .weather-grid {
        flex-wrap: wrap;
      }

      .weather-grid span {
        min-width: calc(50% - 4px);
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fafc;
      }

      .availability {
        display: grid;
        gap: 8px;
      }

      .availability-head {
        justify-content: space-between;
      }

      .risk.low {
        color: var(--green);
        background: #ddf8eb;
      }

      .risk.medium {
        color: var(--amber);
        background: #fff3d7;
      }

      .risk.elevated {
        color: var(--red);
        background: #ffe1e7;
      }

      .player {
        display: grid;
        grid-template-columns: minmax(80px, 1fr) 62px 46px;
        gap: 8px;
        align-items: center;
        min-height: 30px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #f8fafc;
      }

      .source {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fafc;
      }

      .source em {
        color: var(--cyan);
        font-size: 12px;
        font-style: normal;
        font-weight: 850;
        white-space: nowrap;
      }

      .lower {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
        gap: 14px;
      }

      .title-row {
        display: grid;
        grid-template-columns: 28px 34px minmax(120px, 1fr) minmax(80px, 1.6fr) 62px;
        gap: 10px;
        align-items: center;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
      }

      .title-team {
        min-width: 0;
      }

      .title-team strong,
      .title-team em {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .title-team em {
        margin-top: 3px;
        color: var(--muted);
        font-size: 11px;
        font-style: normal;
      }

      .mini {
        height: 8px;
        overflow: hidden;
        border-radius: 4px;
        background: var(--soft);
      }

      .mini i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--blue), var(--cyan), var(--green));
      }

      @media (max-width: 1260px) {
        .workspace {
          grid-template-columns: 320px minmax(0, 1fr);
        }

        .rail {
          grid-column: 1 / -1;
        }
      }

      @media (max-width: 980px) {
        .deck,
        .controls {
          align-items: stretch;
          flex-direction: column;
        }

        .metrics,
        .workspace,
        .lower,
        .split {
          grid-template-columns: 1fr;
        }

        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .hero {
          flex-direction: column;
        }

        .score-lens {
          width: 100%;
          min-width: 0;
        }

        #match-list {
          max-height: 560px;
        }
      }

      @media (max-width: 680px) {
        .shell {
          padding: 12px;
        }

        .metrics,
        .grid {
          grid-template-columns: 1fr;
        }

        .tech-grid {
          grid-template-columns: 1fr;
        }

        .prob-labels {
          grid-template-columns: 1fr;
        }

        .prob-labels span,
        .prob-labels span:nth-child(2),
        .prob-labels span:nth-child(3) {
          text-align: left;
        }

        .factor {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <style>
      :root {
        --bg: #03060a;
        --surface: rgba(8, 14, 20, 0.78);
        --solid: #0c141d;
        --soft: rgba(18, 29, 39, 0.88);
        --ink: #f5f7fb;
        --muted: #93a2b6;
        --line: rgba(139, 163, 190, 0.22);
        --line-strong: rgba(209, 228, 255, 0.34);
        --blue: #66b7ff;
        --cyan: #38d5e8;
        --green: #25d990;
        --red: #ff5f72;
        --amber: #f2c14e;
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.44);
      }

      html {
        overflow-x: hidden;
        background: var(--bg);
      }

      body {
        min-height: 100vh;
        overflow-x: hidden;
        color: var(--ink);
        background:
          linear-gradient(180deg, rgba(2, 6, 10, 0.72), #03060a 440px),
          linear-gradient(115deg, rgba(242, 193, 78, 0.18), transparent 24%, rgba(37, 217, 144, 0.12) 48%, transparent 66%),
          repeating-linear-gradient(90deg, rgba(139, 163, 190, 0.06) 0 1px, transparent 1px 88px),
          repeating-linear-gradient(0deg, rgba(139, 163, 190, 0.045) 0 1px, transparent 1px 72px),
          #03060a;
      }

      body::before {
        position: fixed;
        inset: 0;
        pointer-events: none;
        content: "";
        opacity: 0.46;
        background:
          linear-gradient(90deg, transparent 0 7%, rgba(37, 217, 144, 0.2) 7.1% 7.25%, transparent 7.35% 92.65%, rgba(37, 217, 144, 0.16) 92.75% 92.9%, transparent 93%),
          linear-gradient(0deg, transparent 0 16%, rgba(102, 183, 255, 0.18) 16.1% 16.22%, transparent 16.34% 83.66%, rgba(102, 183, 255, 0.14) 83.78% 83.9%, transparent 84%),
          linear-gradient(120deg, rgba(255, 255, 255, 0.06), transparent 28%);
        mask-image: linear-gradient(180deg, black, transparent 82%);
      }

      .shell {
        position: relative;
        z-index: 1;
        width: min(1640px, 100%);
      }

      .deck,
      .controls,
      .metric,
      .panel,
      .match-list,
      .detail,
      .rail,
      .subpanel {
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
        backdrop-filter: blur(20px);
      }

      .deck {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(330px, 460px);
        align-items: stretch;
        min-height: 250px;
        padding: 22px;
        overflow: hidden;
        border-color: var(--line-strong);
        background:
          linear-gradient(135deg, rgba(10, 19, 29, 0.94), rgba(5, 11, 17, 0.82) 52%, rgba(30, 54, 48, 0.82)),
          linear-gradient(90deg, rgba(242, 193, 78, 0.18), transparent 34%, rgba(56, 213, 232, 0.12));
      }

      .deck::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        background:
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.07) 0 1px, transparent 1px 42px),
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.045) 0 1px, transparent 1px 42px),
          linear-gradient(114deg, transparent 0 34%, rgba(242, 193, 78, 0.12) 34.2% 34.6%, transparent 34.8%);
        mask-image: linear-gradient(90deg, black, transparent 78%);
      }

      .brand,
      .hero-telemetry {
        position: relative;
        z-index: 1;
      }

      .brand {
        min-width: 0;
      }

      .brand > div:last-child {
        min-width: 0;
      }

      .mark {
        width: 68px;
        height: 68px;
        color: #071018;
        border-color: rgba(255, 255, 255, 0.22);
        background: linear-gradient(145deg, #ffe58f, #f2c14e 54%, #23d18b);
        box-shadow: 0 18px 42px rgba(242, 193, 78, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      }

      .eyebrow {
        color: var(--amber);
      }

      h1 {
        max-width: 820px;
        color: var(--ink);
        font-size: clamp(38px, 6vw, 76px);
        line-height: 0.96;
        overflow-wrap: anywhere;
        word-break: break-all;
      }

      .copy {
        max-width: 720px;
        color: #c7d2e2;
        font-size: 16px;
      }

      .hero-telemetry {
        display: grid;
        grid-template-rows: 1fr auto auto;
        gap: 10px;
        min-width: 0;
      }

      .signal-plate {
        position: relative;
        display: grid;
        align-content: center;
        min-height: 150px;
        padding: 18px;
        overflow: hidden;
        border: 1px solid rgba(102, 183, 255, 0.26);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(7, 16, 24, 0.78), rgba(12, 28, 39, 0.66)),
          repeating-linear-gradient(90deg, rgba(102, 183, 255, 0.12) 0 1px, transparent 1px 28px);
        box-shadow: inset 0 0 42px rgba(37, 217, 144, 0.08);
      }

      .signal-plate::before {
        position: absolute;
        right: 16px;
        top: 16px;
        width: 92px;
        height: 92px;
        content: "";
        border: 1px solid rgba(37, 217, 144, 0.5);
        border-radius: 50%;
        background: conic-gradient(from 40deg, rgba(37, 217, 144, 0.08), rgba(102, 183, 255, 0.45), rgba(242, 193, 78, 0.2), rgba(37, 217, 144, 0.08));
        box-shadow: inset 0 0 0 18px rgba(3, 6, 10, 0.62);
      }

      .signal-plate span,
      .signal-plate strong,
      .signal-plate em {
        position: relative;
        z-index: 1;
        display: block;
      }

      .signal-plate span {
        color: var(--cyan);
        font-size: 12px;
        font-weight: 850;
      }

      .signal-plate strong {
        margin-top: 4px;
        color: var(--ink);
        font-size: 54px;
        line-height: 0.95;
        text-shadow: 0 0 24px rgba(102, 183, 255, 0.5);
      }

      .signal-plate em {
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
        font-style: normal;
      }

      .hosts {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        justify-content: stretch;
      }

      .host {
        min-width: 0;
        border-color: rgba(242, 193, 78, 0.24);

    <script>
      const API = "http://127.0.0.1:8000";
      const ESPN_SCOREBOARD = "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard";
      const embeddedData = window.__DASHBOARD_DATA__ || null;
      const compressedDataChunks = ["data.json.gz.b64.0", "data.json.gz.b64.1", "data.json.gz.b64.2", "data.json.gz.b64.3", "data.json.gz.b64.4", "data.json.gz.b64.5", "data.json.gz.b64.6", "data.json.gz.b64.7"];
      const teamAliases = {

      const zhTeams = {

      let livePollTimer = null;
      let state = { matches: [], tournament: null, sources: [], backtest: null, selected: null, group: "ALL", query: "", matchView: "", tab: "handicap" };

      const fallback = {
        matches: [],
        tournament: { n_simulations: 100000, teams: [] },
        sources: [],
        backtest: null
      };

      const pct = (value) => value === null || value === undefined || Number.isNaN(value) ? "-" : `${(value * 100).toFixed(1)}%`;
      const odds = (value) => value ? Number(value).toFixed(2) : "-";
      const line = (value) => Number(value) > 0 ? `+${value}` : `${value}`;
      const signed = (value) => `${Number(value) >= 0 ? "+" : ""}${Number(value).toFixed(2)}`;
      const multiplier = (value) => `${Number(value) >= 1 ? "+" : ""}${((Number(value) - 1) * 100).toFixed(1)}%`;
      const flag = (team, big = false) => `<img class="flag ${big ? "big" : ""}" src="https://flagcdn.com/w40/${team.flag_code}.png" alt="${team.name || team.team} flag" />`;
      const team = (item) => `<span class="inline-team">${flag(item)}<span>${item.name || item.team}</span></span>`;
      const dateText = (value) => new Intl.DateTimeFormat("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Shanghai" }).format(new Date(value));

      async function getJson(path, fallbackValue) {
        try {
          const url = path.startsWith(".") ? path : `${API}${path}`;
          const response = await fetch(url);
          if (!response.ok) return fallbackValue;
          return await response.json();
        } catch {
          return fallbackValue;
        }
      }

      async function getCompressedJson(paths) {
        if (!("DecompressionStream" in window)) return null;
        try {
          const chunks = await Promise.all(paths.map(async (path) => {
            const response = await fetch(path, { cache: "no-store" });
            if (!response.ok) throw new Error("missing chunk");
            return response.text();
          }));
          const binary = atob(chunks.join("").replace(/\s/g, ""));
          const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
          const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
          return JSON.parse(await new Response(stream).text());
        } catch {
          return null;
        }
      }

      async function boot() {
        const localData = embeddedData || await getCompressedJson(compressedDataChunks) || await getJson("./data.json", null);
        if (localData && localData.matches && localData.tournament && localData.sources) {
          state.matches = localData.matches;
          state.tournament = localData.tournament;
          state.sources = localData.sources;
          state.backtest = localData.backtest || null;
          state.matchView = defaultMatchView(state.matches);
          state.selected = firstVisibleMatch() || state.matches[0] || null;
          bind();
          render();
          if (new URLSearchParams(window.location.search).get("api") === "1") refreshFromApi();
          startPublicLivePolling();
          return;
        }
        const [matches, tournament, health, backtest] = await Promise.all([
          getJson("/api/matches", { matches: fallback.matches }),
          getJson("/api/tournament/probabilities", fallback.tournament),
          getJson("/api/source-health", { sources: fallback.sources }),
          getJson("/api/backtest/report", fallback.backtest)
        ]);
        state.matches = matches.matches || [];
        state.tournament = tournament;
        state.sources = health.sources || [];
        state.backtest = backtest;
        state.matchView = defaultMatchView(state.matches);
        state.selected = firstVisibleMatch() || state.matches[0] || null;
        bind();
        render();
        startPublicLivePolling();
      }

      async function refreshFromApi() {
        const [matches, tournament, health, backtest] = await Promise.all([
          getJson("/api/matches", null),
          getJson("/api/tournament/probabilities", null),
          getJson("/api/source-health", null),
          getJson("/api/backtest/report", null)
        ]);
        if (!matches || !matches.matches || !tournament || !health || !health.sources) return;
        const selectedId = state.selected && state.selected.match_id;
        state.matches = matches.matches;
        state.tournament = tournament;
        state.sources = health.sources;
        state.backtest = backtest || state.backtest;
        state.selected = state.matches.find((match) => match.match_id === selectedId) || firstVisibleMatch() || state.matches[0] || null;
        render();
      }

      function startPublicLivePolling() {
        if (livePollTimer || !state.matches.length) return;
        refreshFromEspnPublic();
        livePollTimer = window.setInterval(refreshFromEspnPublic, 60000);
      }

      async function refreshFromEspnPublic() {
        try {
          const payloads = await Promise.all(liveDateKeys().map(async (dateKey) => {
            const response = await fetch(`${ESPN_SCOREBOARD}?dates=${dateKey}`, { cache: "no-store" });
            if (!response.ok) return null;
            return response.json();
          }));
          const rows = normalizeEspnEvents(payloads.flatMap((payload) => payload?.events || []));
          if (!rows.length) return;
          const byId = new Map(rows.map((row) => [row.match_id, row]));
          state.matches = state.matches.map((match) => {
            const live = byId.get(match.match_id);
            if (!live) return match;
            return applyLiveToMatch({ ...match, live_status: live });
          });
          const selectedId = state.selected?.match_id;
          state.selected = state.matches.find((match) => match.match_id === selectedId) || firstVisibleMatch() || state.matches[0] || null;
          updateEspnSource(rows);
          render();
        } catch (_error) {
          // Public live polling is best-effort; keep the last static snapshot.
        }
      }

      function liveDateKeys() {
        const out = [];
        const now = new Date();
        for (let offset = -1; offset <= 2; offset += 1) {
          const date = new Date(now.getTime() + offset * 86400000);
          out.push(dateKeyInZone(date, "America/New_York"));
        }
        return Array.from(new Set(out));
      }

      function dateKeyInZone(date, timeZone) {
        const parts = new Intl.DateTimeFormat("en-US", {
          timeZone,
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).formatToParts(date).reduce((acc, part) => {
          acc[part.type] = part.value;
          return acc;
        }, {});
        return `${parts.year}${parts.month}${parts.day}`;
      }

      function normalizeEspnEvents(events) {
        const aliases = teamAliasMap();
        const rows = [];
        const seen = new Set();
        for (const event of events) {
          const competition = event.competitions?.[0] || {};
          const competitors = competition.competitors || [];
          const home = competitors.find((row) => row.homeAway === "home");
          const away = competitors.find((row) => row.homeAway === "away");
          if (!home || !away) continue;
          const homeId = teamIdForCompetitor(home, aliases);
          const awayId = teamIdForCompetitor(away, aliases);
          const match = state.matches.find((candidate) => candidate.fixture.home_team_id === homeId && candidate.fixture.away_team_id === awayId);
          if (!match || seen.has(match.match_id)) continue;
          seen.add(match.match_id);
          const status = event.status || competition.status || {};
          const type = status.type || {};
          const liveOrFinal = Boolean(type.completed) || type.state === "in";
          rows.push({
            match_id: match.match_id,
            source: "ESPN public scoreboard",
            source_quality: "live_public_unofficial",
            captured_at: new Date().toISOString(),
            status_state: type.state,
            status_description: type.description,
            status_detail: type.detail || type.shortDetail,
            completed: Boolean(type.completed),
            display_clock: status.displayClock,
            period: status.period,
            home_score: liveOrFinal ? numberOrNull(home.score) : null,
            away_score: liveOrFinal ? numberOrNull(away.score) : null,
            winner_team_id: home.winner ? homeId : away.winner ? awayId : null,
            attendance: liveOrFinal ? competition.attendance : null,
            home_stats: liveOrFinal ? statsFromCompetitor(home) : {},
            away_stats: liveOrFinal ? statsFromCompetitor(away) : {}
          });
        }
        return rows;
      }

      function teamAliasMap() {
        const aliases = { ...teamAliases };
        state.matches.forEach((match) => {
          [match.home_team, match.away_team].forEach((teamInfo) => {
            aliases[key(teamInfo.name)] = teamInfo.id;
            aliases[key(teamInfo.fifa_code || "")] = teamInfo.id;
          });
        });
        return aliases;
      }

      function teamIdForCompetitor(competitor, aliases) {
        const teamInfo = competitor.team || {};
        const candidates = [teamInfo.displayName, teamInfo.shortDisplayName, teamInfo.name, teamInfo.location, teamInfo.abbreviation];
        for (const candidate of candidates) {
          const teamId = aliases[key(candidate || "")];
          if (teamId) return teamId;
        }
        return null;
      }

      function statsFromCompetitor(competitor) {
        const out = {};
        (competitor.statistics || []).forEach((stat) => {
          const mapped = statMap[stat.name];
          if (mapped) out[mapped] = numberOrNull(String(stat.displayValue || "").replace("%", ""));
        });
        return out;
      }

      function applyLiveToMatch(match) {
        const live = match.live_status;
        const hasStats = live && (Object.keys(live.home_stats || {}).length || Object.keys(live.away_stats || {}).length);
        const next = {
          ...match,
          event_predictions: applyLiveEvents(match.event_predictions, live)
        };
        if (!hasStats || !match.tactical_profile) return next;
        return {
          ...next,
          tactical_profile: {
            ...match.tactical_profile,
            source: "ESPN public scoreboard basic stats + seed-derived xG/PPDA",
            data_quality: "mixed_live_public_proxy",
            home: applyLiveStats(match.tactical_profile.home, live.home_stats),
            away: applyLiveStats(match.tactical_profile.away, live.away_stats)
          }
        };
      }

      function applyLiveEvents(events, live) {
        if (!events || !live) return events;
        const homeStats = live.home_stats || {};
        const awayStats = live.away_stats || {};
        return {
          ...events,
          data_quality: Object.keys(homeStats).length || Object.keys(awayStats).length ? "mixed_live_public_proxy" : events.data_quality,
          score: {
            ...(events.score || {}),
            actual_home_score: live.home_score,
            actual_away_score: live.away_score,
            status: live.status_description || live.status_state || events.score?.status
          },
          corners: {
            ...(events.corners || {}),
            live_home: homeStats.corners ?? events.corners?.live_home,
            live_away: awayStats.corners ?? events.corners?.live_away
          },
          cards: {
            ...(events.cards || {}),
            live_home_yellow: homeStats.yellow_cards ?? events.cards?.live_home_yellow,
            live_away_yellow: awayStats.yellow_cards ?? events.cards?.live_away_yellow,
            live_home_red: homeStats.red_cards ?? events.cards?.live_home_red,
            live_away_red: awayStats.red_cards ?? events.cards?.live_away_red
          }
        };
      }

      function applyLiveStats(profile, stats) {
        if (!profile || !stats) return profile;
        const next = { ...profile };
        if (stats.possession_pct !== null && stats.possession_pct !== undefined) next.possession_pct = Number(stats.possession_pct);
        if (stats.shots !== null && stats.shots !== undefined) next.shots_per_game = Number(stats.shots);
        if (stats.shots_on_target !== null && stats.shots_on_target !== undefined) next.shots_on_target_per_game = Number(stats.shots_on_target);
        next.live_corners = stats.corners;
        next.live_fouls_committed = stats.fouls_committed;
        next.live_assists = stats.assists;
        next.live_goals = stats.goals;
        next.live_yellow_cards = stats.yellow_cards;
        next.live_red_cards = stats.red_cards;
        next.live_public_stats = true;
        return next;
      }

      function updateEspnSource(rows) {
        const completed = rows.filter((row) => row.completed).length;
        const inPlay = rows.filter((row) => row.status_state === "in").length;
        const source = {
          source: "ESPN public scoreboard",
          status: "browser_live_public",
          freshness: `${rows.length} nearby events; ${completed} completed; ${inPlay} in-play at ${shortTime(new Date().toISOString())}`,
          purpose: "browser no-key live score, status and basic public match stats"
        };
        state.sources = [source, ...state.sources.filter((row) => row.source !== source.source)];
      }

      function numberOrNull(value) {
        if (value === null || value === undefined || value === "") return null;
        const number = Number(value);
        return Number.isFinite(number) ? number : null;
      }

      function key(value) {
        return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
      }

      function bind() {
        document.getElementById("search").addEventListener("input", (event) => {
          state.query = event.target.value.trim().toLowerCase();
          state.selected = firstVisibleMatch() || state.selected;
          render();
        });
      }

      function baseFilteredMatches() {
        return state.matches.filter((match) => {
          const inGroup = state.group === "ALL" || match.fixture.group === state.group;
          const q = state.query;
          const inQuery = !q ||
            match.home_team.name.toLowerCase().includes(q) ||
            match.away_team.name.toLowerCase().includes(q) ||
            match.fixture.city.toLowerCase().includes(q) ||
            match.fixture.venue.toLowerCase().includes(q);
          return inGroup && inQuery;
        });
      }

      function filteredMatches() {
        return visibleMatches(baseFilteredMatches());
      }

      function visibleMatches(matches = baseFilteredMatches()) {
        return matches.filter((match) => matchInView(match, state.matchView || "ALL"));
      }

      function firstVisibleMatch() {
        const matches = visibleMatches();
        if (!matches.length) return null;
        const live = matches.find((match) => matchStatus(match) === "live");
        if (live) return live;
        const upcoming = matches.find((match) => matchStatus(match) === "upcoming");
        if (upcoming) return upcoming;
        return matches[matches.length - 1];
      }

      function defaultMatchView(matches) {
        const counts = matchViewCounts(matches);
        if (counts.TODAY) return "TODAY";
        if (counts.LIVE) return "LIVE";
        if (counts.UPCOMING) return "UPCOMING";
        if (counts.FINISHED) return "FINISHED";
        return "ALL";
      }

      function matchViewCounts(matches) {
        return {
          LIVE: matches.filter((match) => matchStatus(match) === "live").length,
          TODAY: matches.filter(isTodayMatch).length,
          UPCOMING: matches.filter((match) => matchStatus(match) === "upcoming").length,
          FINISHED: matches.filter((match) => matchStatus(match) === "finished").length,
          ALL: matches.length
        };
      }

      function matchInView(match, view) {
        const status = matchStatus(match);
        if (view === "LIVE") return status === "live";
        if (view === "TODAY") return isTodayMatch(match);
        if (view === "UPCOMING") return status === "upcoming";
        if (view === "FINISHED") return status === "finished";
        return true;
      }

      function matchSections() {
        return [
          { title: "正在进行", filter: (match) => matchStatus(match) === "live" },
          { title: "今日未赛", filter: (match) => matchStatus(match) === "upcoming" && isTodayMatch(match) },
          { title: "未来未赛", filter: (match) => matchStatus(match) === "upcoming" && !isTodayMatch(match) },
          { title: "今日完赛", filter: (match) => matchStatus(match) === "finished" && isTodayMatch(match), reverse: true },
          { title: "已完赛", filter: (match) => matchStatus(match) === "finished" && !isTodayMatch(match), reverse: true }
        ];
      }

      function matchStatus(match) {
        const live = match.live_status || {};
        if (live.status_state === "in") return "live";
        if (live.completed || live.status_state === "post") return "finished";
        return "upcoming";
      }

      function isTodayMatch(match) {
        return dateKeyInZone(new Date(match.fixture.kickoff_utc), "Asia/Shanghai") === dateKeyInZone(new Date(), "Asia/Shanghai");
      }

      function render() {
        if (!state.matches.length) {
          document.getElementById("detail").innerHTML = `<div class="subpanel">后端 API 暂时没有返回比赛数据。</div>`;
          return;
        }
        renderGroups();
        renderMetrics();
        renderMatchList();
        renderDetail();
        renderRail();
        renderTournament();
        renderBacktest();
        renderSources();
      }

      function renderGroups() {
        const groups = ["ALL", ...Array.from(new Set(state.matches.map((match) => match.fixture.group))).sort()];
        document.getElementById("groups").innerHTML = groups.map((group) =>
          `<button class="${state.group === group ? "active" : ""}" data-group="${group}">${group === "ALL" ? "全部" : group}</button>`
        ).join("");
        document.querySelectorAll("[data-group]").forEach((button) => {
          button.addEventListener("click", () => {
            state.group = button.dataset.group;
            const next = firstVisibleMatch();
            if (next) state.selected = next;
            render();
          });
        });
      }

      function renderMetrics() {
        const top = state.tournament?.teams?.[0];
        const marketCount = state.matches.reduce((sum, match) => sum + match.handicap_preview.filter((row) => row.market_status === "available").length, 0);
        const confidence = state.selected ? confidenceScore(state.selected) : 0;
        const current = state.selected ? currentWinProjection(state.selected) : null;
        const currentLeader = current && currentLeaderText(state.selected, current);
        const formal = state.backtest?.formal || {};
        const formalOneXTwo = normalizePerformance(formal.one_x_two, { samples: 0, correct: 0, hit_rate: null });
        const formalAsian = normalizePerformance(formal.asian_handicap, { samples: 0, correct: 0, hit_rate: null });
        const formalOverUnder = normalizePerformance(formal.over_under, { samples: 0, correct: 0, hit_rate: null });
        const formalCorners = normalizePerformance(formal.corners, { samples: 0, correct: 0, hit_rate: null });
        const comparison = state.backtest?.model_comparison || {};
        const ensemble = normalizePerformance(comparison.production_ensemble, { samples: 0, correct: 0, hit_rate: null });
        const shadowOverUnder = normalizePerformance(state.backtest?.shadow?.over_under, { samples: 0, correct: 0, hit_rate: null });
        const liveSources = state.sources.filter((source) => source.status !== "planned").length;
        const realLineups = state.matches.filter((match) => materialAvailable(match)).length;
        document.getElementById("hero-confidence").textContent = pct(confidence);
        document.getElementById("hero-markets").textContent = `${marketCount} handicap markets`;
        document.getElementById("hero-sources").textContent = `${liveSources}/${state.sources.length} data sources`;
        document.getElementById("metrics").innerHTML = [
          metric("赛前锁定 1X2", metricHitText(formalOneXTwo), metricHitSub(formalOneXTwo, "真实发布")),
          metric("赛前锁定让球", metricHitText(formalAsian), `${metricHitSub(formalAsian, "真实发布")} · ROI ${pctOrDash(formal.asian_handicap?.roi)} · 已暂停方向`),
          metric("赛前锁定大小球", metricHitText(formalOverUnder), metricHitSub(formalOverUnder, "真实发布")),
          metric("赛前锁定角球", metricHitText(formalCorners), `${metricHitSub(formalCorners, "真实发布")} · 已暂停方向`),
          metric("新模型 1X2 烟测", metricHitText(ensemble), ensemble.samples ? `Brier ${metricNumber(ensemble.brier)} · 裸模型 ${metricNumber(comparison.baseline?.brier)}` : "等待同样本比较"),
          metric("新模型大小球烟测", metricHitText(shadowOverUnder), shadowOverUnder.samples ? `Brier ${metricNumber(shadowOverUnder.brier)} · 非锁定成绩` : "等待同样本比较"),
          metric("单场当前胜率", currentLeader ? currentLeader.value : "-", current ? currentLeader.sub : "等待比赛选择"),
          metric("赛制覆盖", `${state.tournament?.projected_matches_total || state.matches.length} 场`, "72 场小组赛 + 32 场淘汰赛投影"),
          metric("亚洲盘口", `${marketCount} 条`, "含半赢、走盘、公平赔率"),
          metric("真实首发", `${realLineups} 场`, "ESPN summary 阵型/首发/球员事件"),
          metric("最高夺冠", top ? pct(top.title_probability) : "-", top ? `${top.team} · 裸模型 ${pct(top.raw_title_probability)}` : "等待模拟"),
          metric("公开市场", `${state.tournament?.title_anchor?.coverage || 0} 队`, `锚定权重 ${pct(state.tournament?.title_anchor?.weight || 0)}`)
        ].join("");
      }

      function metric(label, value, sub) {
        return `<div class="metric"><span>${label}</span><b>${value}</b><small>${sub}</small></div>`;
      }

      function renderMatchList() {
        const baseMatches = baseFilteredMatches();
        const matches = visibleMatches(baseMatches);
        renderMatchViewTabs(baseMatches);
        document.getElementById("match-count").textContent = `${matches.length}/${baseMatches.length}`;
        document.getElementById("match-list").innerHTML = renderMatchSections(matches) || `<div class="match-empty">当前筛选没有比赛。可以切到“全部”或清空搜索。</div>`;
        document.querySelectorAll("[data-match]").forEach((button) => {
          button.addEventListener("click", () => {
            state.selected = state.matches.find((match) => match.match_id === button.dataset.match);
            render();
          });
        });
      }

      function renderMatchViewTabs(baseMatches) {
        const counts = matchViewCounts(baseMatches);
        const views = [
          ["LIVE", "进行中", counts.LIVE],
          ["TODAY", "今日", counts.TODAY],
          ["UPCOMING", "未赛", counts.UPCOMING],
          ["FINISHED", "已完赛", counts.FINISHED],
          ["ALL", "全部", counts.ALL]
        ];
        document.getElementById("match-view-tabs").innerHTML = views.map(([key, label, count]) =>
          `<button class="${state.matchView === key ? "active" : ""}" data-match-view="${key}">${label} ${count}</button>`
        ).join("");
        document.querySelectorAll("[data-match-view]").forEach((button) => {
          button.addEventListener("click", () => {
            state.matchView = button.dataset.matchView;
            state.selected = firstVisibleMatch() || state.selected;
            render();
          });
        });
      }

      function renderMatchSections(matches) {
        return matchSections().map((section) => {
          const rows = matches.filter(section.filter);
          if (!rows.length) return "";
          const orderedRows = section.reverse ? [...rows].reverse() : rows;
          return `
            <div class="match-section-title"><span>${section.title}</span><span>${rows.length}</span></div>
            ${orderedRows.map(renderMatchRow).join("")}
          `;
        }).join("");
      }

      function renderMatchRow(match) {
        const active = state.selected && match.match_id === state.selected.match_id;
        const marketRows = match.handicap_preview.filter((row) => row.market_status === "available").length;
        return `
          <button class="match-row ${active ? "active" : ""}" data-match="${match.match_id}">
            <span class="match-meta">#${match.fixture.match_number} · ${match.fixture.group}组 · ${dateText(match.fixture.kickoff_utc)}</span>
            <span class="team-line">${team(match.home_team)}<strong>${scoreOrProbability(match, "home")}</strong></span>
            <span class="team-line">${team(match.away_team)}<strong>${scoreOrProbability(match, "away")}</strong></span>
            <span class="badges"><em class="badge">${liveLabel(match)}</em><em class="badge">${match.weather?.condition || "normal"}</em><em class="badge">${marketRows ? `${marketRows} 市场` : "模型公平盘"}</em></span>
          </button>
        `;
      }

      function renderDetail() {
        const match = state.selected;
        document.getElementById("rail-group").textContent = `${match.fixture.group}组`;
        document.getElementById("detail").innerHTML = `
          <header class="hero">
            <div>
              <p class="eyebrow">MATCH #${match.fixture.match_number}</p>
              <h2>${match.home_team.name} <span class="muted">vs</span> ${match.away_team.name}</h2>
              <div class="venue">${dateText(match.fixture.kickoff_utc)} · ${match.fixture.venue} · ${match.fixture.city} · ${liveLabel(match)}</div>
            </div>
            <div class="score-lens">
              ${flag(match.home_team, true)}
              <div><strong>${scoreLens(match)}</strong><span class="muted">${hasActualScore(match) ? "实时/赛果" : "预期进球"}</span></div>
              ${flag(match.away_team, true)}
            </div>
          </header>
          ${livePanel(match)}
          ${probability(match)}
          <div class="tabs">
            ${tabButton("handicap", "盘口矩阵")}
            ${tabButton("advice", "盘口研究")}
            ${tabButton("script", "预测分析")}
            ${tabButton("events", "比分事件")}
            ${tabButton("stats", "技术统计")}
            ${tabButton("model", "模型因子")}
            ${tabButton("history", "球队历史")}
            ${tabButton("matchup", "战术爆冷")}
            ${tabButton("players", "首发球员")}
          </div>
          <div id="tab-content">${tabContent(match)}</div>
        `;
        document.querySelectorAll("[data-tab]").forEach((button) => {
          button.addEventListener("click", () => {
            state.tab = button.dataset.tab;
            renderDetail();
          });
        });
      }

      function livePanel(match) {
        if (!match.live_status || match.live_status.status_state === "pre") return "";
        const live = match.live_status;
        return `
          <div class="subpanel" style="margin:14px 0">
            <span class="data-chip">${live.source || "live source"} · ${live.source_quality || "live_public"} · ${live.captured_at ? shortTime(live.captured_at) : ""}</span>
            <p class="source-note">${live.status_description || live.status_state || "-"}${live.display_clock ? ` · ${live.display_clock}` : ""}${live.attendance ? ` · attendance ${Number(live.attendance).toLocaleString()}` : ""}</p>
          </div>
        `;
      }

      function probability(match) {
        const current = currentWinProjection(match);
        return `
          <div class="prob">
            <div class="prob-labels">
              <span>赛前 ${match.home_team.name} ${pct(match.p_home)}</span>
              <span>赛前平局 ${pct(match.p_draw)}</span>
              <span>赛前 ${match.away_team.name} ${pct(match.p_away)}</span>
            </div>
            <div class="prob-bar">
              <i class="home" style="width:${Math.max(4, match.p_home * 100)}%"></i>
              <i class="draw" style="width:${Math.max(4, match.p_draw * 100)}%"></i>
              <i class="away" style="width:${Math.max(4, match.p_away * 100)}%"></i>
            </div>
            <div class="subpanel" style="margin-top:10px">
              <span class="data-chip">单场当前胜率 · ${current.label}</span>
              <div class="prob-labels" style="margin-top:10px">
                <span>${match.home_team.name} ${pct(current.home)}</span>
                <span>平局 ${pct(current.draw)}</span>
                <span>${match.away_team.name} ${pct(current.away)}</span>
              </div>
              <div class="prob-bar">
                <i class="home" style="width:${Math.max(4, current.home * 100)}%"></i>
                <i class="draw" style="width:${Math.max(4, current.draw * 100)}%"></i>
                <i class="away" style="width:${Math.max(4, current.away * 100)}%"></i>
              </div>
              <p class="source-note">${current.note}</p>
            </div>
          </div>
        `;
      }

      function tabButton(key, label) {
        return `<button class="${state.tab === key ? "active" : ""}" data-tab="${key}">${label}</button>`;
      }

      function tabContent(match) {
        if (state.tab === "advice") return advicePanel(match);
        if (state.tab === "script") return scriptPanel(match);
        if (state.tab === "events") return eventsPanel(match);
        if (state.tab === "stats") return technicalPanel(match);
        if (state.tab === "model") return modelPanel(match);
        if (state.tab === "history") return historyPanel(match);
        if (state.tab === "matchup") return matchupPanel(match);
        if (state.tab === "players") return playersPanel(match);
        return handicapTable(match);
      }

      function handicapTable(match) {
        return `
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>主队盘口</th><th>${match.home_team.name}</th><th>${match.away_team.name}</th><th>走盘</th><th>公平赔率</th><th>市场赔率</th><th>方向状态</th></tr>
              </thead>
              <tbody>
                ${match.handicap_preview.map((row) => `
                  <tr>
                    <td class="mono"><strong>${line(row.line)}</strong></td>
                    <td><strong>${pct(row.home.positive_probability)}</strong><small>半赢 ${pct(row.home.half_win)} · 半输 ${pct(row.home.half_loss)}</small></td>
                    <td><strong>${pct(row.away.positive_probability)}</strong><small>半赢 ${pct(row.away.half_win)} · 半输 ${pct(row.away.half_loss)}</small></td>
                    <td>${pct(row.home.push)}</td>
                    <td><span class="mono">${odds(row.home.fair_decimal_odds)}</span><small>客 ${odds(row.away.fair_decimal_odds)}</small></td>
                    <td><span class="mono">${row.market_status === "available" ? odds(row.home.market_decimal_odds) : row.market_status === "proxy" ? "样例盘口" : "暂无市场"}</span><small>${row.market_status === "available" ? `客 ${odds(row.away.market_decimal_odds)}` : row.source} · ${row.closing_status || "closing pending"}</small></td>
                    <td><span class="lean ${row.lean === "home" ? "home-lean" : row.lean === "away" ? "away-lean" : ""}">${row.lean_status === "suspended_negative_locked_roi" ? "已暂停" : row.lean === "home" ? "主队" : row.lean === "away" ? "客队" : "观察"}</span></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function advicePanel(match) {
        const rows = bettingReferences(match);
        return `
          <div class="subpanel" style="margin-bottom:10px">
            <span class="data-chip">盘口研究参考 · 非投注建议</span>
            <p class="source-note">按市场类型分开展示：不让球胜平负是三结果，亚洲平手盘是平局退回，欧洲让球仍有胜/平/负三项。只展示概率、市场差异和模型倾向；不包含下注指令、仓位、Kelly 或收益承诺。</p>
          </div>
          <div class="grid">
            ${rows.map((row) => `
              <div class="subpanel">
                <div class="factor-meta">
                  <span>${row.category}</span>
                  <span>${row.source_type}</span>
                  <span class="${row.confidence === "低" ? "unused" : ""}">置信 ${row.confidence}</span>
                </div>
                <h3 style="margin-top:12px">${row.pick}</h3>
                <div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:10px">
                  ${tile(row.metric_a_label, row.metric_a)}
                  ${tile(row.metric_b_label, row.metric_b)}
                </div>
                <p class="source-note">${row.note}</p>
              </div>
            `).join("")}
          </div>
        `;
      }

      function scriptPanel(match) {
        const report = buildMatchReport(match);
        return `
          <div class="story-block">
            <div class="subpanel story-lead">
              <span class="data-chip">${report.modeLabel} · 多视角模型报告 · 非投注建议</span>
              <h3>${report.opening}</h3>
              <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-top:2px">
                ${report.tiles.map((item) => tile(item.label, item.value)).join("")}
              </div>
              <p class="source-note">${report.picture}</p>
            </div>
            <div class="view-grid">
              ${report.views.map((view) => `
                <div class="view-card">
                  <span class="data-chip">${view.name}</span>
                  <b>${view.pick}</b>
                  <small>${view.reason}</small>
                  <p class="source-note">${view.warning}</p>
                </div>
              `).join("")}
            </div>
            <div class="split">
              <div class="subpanel">
                <h3>赛前材料板</h3>
                <div class="rail-body" style="padding:10px 0 0">
                  ${report.materials.map((row) => `
                    <div class="material-row">
                      <div><strong>${row.title}</strong><em>${row.body}</em></div>
                      <span class="mono">${row.value}</span>
                    </div>
                  `).join("")}
                </div>
                <p class="source-note">${report.materialNote}</p>
              </div>
              <div class="subpanel">
                <h3>${report.duelTitle}</h3>
                <div class="rail-body" style="padding:10px 0 0">
                  ${report.duels.map((row) => `
                    <div class="source">
                      <div><strong>${row.title}</strong><span>${row.body}</span></div>
                      <em>${row.tag}</em>
                    </div>
                  `).join("")}
                </div>
              </div>
            </div>
            ${report.sections.map((section) => `
              <div class="subpanel story-section">
                <div class="factor-meta"><span>${section.kicker}</span><span>${section.source}</span></div>
                <h3>${section.title}</h3>
                <ol class="story-list">
                  ${section.points.map((point) => `<li><strong>${point.title}</strong>${point.body}</li>`).join("")}
                </ol>
              </div>
            `).join("")}
            <div class="subpanel">
              <h3>${report.sceneTitle}</h3>
              <div class="rail-body" style="padding:10px 0 0">
                ${report.scenes.map((scene) => `
                  <div class="source story-scene">
                    <div><strong>${scene.title}</strong><span>${scene.body}</span></div>
                    <em>${scene.tag}</em>
                  </div>
                `).join("")}
              </div>
            </div>
            <div class="subpanel">
              <h3>${report.riskTitle}</h3>
              <ol class="story-list">
                ${report.risks.map((risk) => `<li><strong>${risk.title}</strong>${risk.body}</li>`).join("")}
              </ol>
              <p class="source-note">${report.finalLine}</p>
            </div>
          </div>
        `;
      }

      function buildMatchReport(match) {
        const home = teamName(match.home_team);
        const away = teamName(match.away_team);
        const outcomes = rankedOutcomes(match);
        const top = outcomes[0];
        const favoriteSide = top.key === "draw" ? (Number(match.p_home || 0) >= Number(match.p_away || 0) ? "home" : "away") : top.key;
        const favorite = favoriteSide === "home" ? home : away;
        const underdog = favoriteSide === "home" ? away : home;
        const archetype = scriptArchetype(match, top, favoriteSide);
        const direction = scriptDirection(match, top, favoriteSide, favorite, underdog);
        const score = formatLikelyScore(match);
        const reportSeed = seededIndex(match, 997);
        const modeLabel = hasActualScore(match) ? "赛后复盘" : "赛前预测";
        const opening = reportOpening(match, top, favoriteSide, favorite, underdog, archetype, reportSeed);
        const picture = reportPicture(match, favoriteSide, favorite, underdog, archetype, reportSeed);
        const tiles = [
          { label: "比赛类型", value: archetype.label },
          { label: "主方向", value: `${top.label} ${pct(top.probability)}` },
          { label: "盘口方向", value: direction },
          { label: "比分峰值", value: score },
          { label: "置信度", value: `${pct(confidenceScore(match))} · ${(match.confidence_profile || {}).tier || "中"}` }
        ];
        return {
          modeLabel,
          opening,
          picture,
          tiles,
          views: reportViews(match, top, favoriteSide, favorite, underdog, archetype),
          materials: reportMaterials(match, favoriteSide, favorite, underdog),
          materialNote: materialNote(match),
          duelTitle: duelTitle(match, archetype, favorite, underdog),
          duels: reportDuels(match, favoriteSide, favorite, underdog, archetype),
          sections: reportSections(match, top, favoriteSide, favorite, underdog, archetype),
          sceneTitle: sceneTitle(archetype, reportSeed),
          scenes: reportScenes(match, favoriteSide, favorite, underdog, archetype, reportSeed),
          riskTitle: riskTitle(archetype),
          risks: reportRisks(match, top, favoriteSide, favorite, underdog, archetype),
          finalLine: reportFinalLine(match, top, score, direction, archetype)
        };
      }

      function rankedOutcomes(match) {
        const home = teamName(match.home_team);
        const away = teamName(match.away_team);
        return [
          { key: "home", label: `${home}胜`, team: home, probability: Number(match.p_home || 0) },
          { key: "draw", label: "平局", team: "平局", probability: Number(match.p_draw || 0) },
          { key: "away", label: `${away}胜`, team: away, probability: Number(match.p_away || 0) }
        ].sort((a, b) => b.probability - a.probability);
      }

      function reportOpening(match, top, favoriteSide, favorite, underdog, archetype, seed) {
        const actual = hasActualScore(match) ? actualScore(match, match.event_predictions?.score || {}) : "";
        const lines = {
          deep_favorite: [
            `这场我不会只写“${favorite}更强”。真正的问题是：它能不能把胜负优势打成净胜球优势。`,
            `${favorite}是主线，但这不是胜负题，是深盘、替补火力和后段强度一起决定的题。`,
            `如果只看胜率，这场很简单；如果看盘口，它要回答的是${favorite}能不能持续踩到终场。`
          ],
          set_piece: [
            `这场的主线不在控球率表面，而在边路、角球和定位球的连续施压。`,
            `${favorite}方向更顺，但我真正盯的是角球怎样把比赛一点点推歪。`,
            `这不是单纯谁名气大的比赛，定位球质量可能比中路传控更早决定局面。`
          ],
          card_chaos: [
            `我更看好${favorite}，但这场不会顺滑，犯规和黄牌会反复打断节奏。`,
            `这场看起来是胜负题，实际更像纪律题：谁先被牌拖住，谁的战术先变形。`,
            `${favorite}有优势，可牌和定位球会把比赛切成一段一段，不能按理想节奏推演。`
          ],
          weather_drag: [
            `方向我站${favorite}，但天气会把技术优势打折，比分和大小球都要谨慎。`,
            `这场先看场地和天气，再看传控。湿滑、风和闷热会让模型的不确定性抬高。`,
            `${favorite}是更好的那边，不过环境会把漂亮进攻变成更多二点球和门前混战。`
          ],
          knife_edge: [
            `我更看好${favorite}一点点，但这场不能写成碾压，第一球比阵容名气更重要。`,
            `这是细节局，不是态度局。${favorite}有倾向，${underdog}也有足够空间把比赛拖进泥潭。`,
            `模型给${favorite}领先半档，但这场最贵的不是站队，而是谁先犯第一个大错。`
          ],
          pressure_build: [
            `${favorite}方向更清楚，但它需要用持续压迫把优势兑现，不是开球就自动赢。`,
            `我看好${favorite}，理由不是一句实力强，而是它更容易把球权变成禁区压力。`,
            `${favorite}要赢，路径大概率是慢慢把${underdog}压低，而不是一脚就解决。`
          ],
          balanced_edge: [
            `${favorite}略占主线，但这场要按概率分布看，别把倾向写成定论。`,
            `这场没有那种“闭眼选”的味道，${favorite}更稳，但比分会比胜负更难猜。`,
            `我会给${favorite}方向，但重点是风险边界：平局和一球小胜都在分布里。`
          ]
        };
        const base = pickSeeded(lines[archetype.key] || lines.balanced_edge, seed);
        if (!hasActualScore(match)) return base;
        const verdict = actualOutcome(match) === top.key ? "主方向兑现了" : "主方向没有兑现";
        return `${base} 现在已经完赛，实际 ${actual}，所以这段切成复盘：${verdict}，再看比分、盘口、大小球和角球哪里偏离。`;
      }

      function reportPicture(match, favoriteSide, favorite, underdog, archetype, seed) {
        const score = match.event_predictions?.score || {};
        const favGoals = favoriteSide === "home" ? score.expected_home_goals : score.expected_away_goals;
        const dogGoals = favoriteSide === "home" ? score.expected_away_goals : score.expected_home_goals;
        const corners = match.event_predictions?.corners || {};
        const cards = match.event_predictions?.cards || {};
        const actual = hasActualScore(match) ? `实际比分 ${actualScore(match, score)}，` : "";
        if (archetype.key === "deep_favorite") {
          return `${actual}我脑子里的主画面是${favorite}把比赛压成半场攻防：预期进球 ${value(favGoals, 2)}:${value(dogGoals, 2)}，但深盘成败取决于领先后还追不追第二波、第三波。`;
        }
        if (archetype.key === "set_piece") {
          return `${actual}关键画面是边路连续打到底线，角球预期 ${value(corners.total_expected, 1)} 个；如果前点和二点球处理好，比分会比运动战看起来更突然。`;
        }
        if (archetype.key === "card_chaos") {
          return `${actual}这场我先看犯规密度：黄牌预期 ${value(cards.total_yellow_expected, 1)}，红牌概率 ${pct(cards.any_red_probability)}。一张早牌就可能改变边后卫和中卫的防守动作。`;
        }
        if (archetype.key === "weather_drag") {
          return `${actual}天气标记为 ${match.weather?.condition || "normal"}，所以我更相信二点球、解围不远、门将二次处理这些“不漂亮但真实”的机会。`;
        }
        if (archetype.key === "knife_edge") {
          return `${actual}这场的画面不会很豪华：前30分钟互相试探，第一球更可能来自一次转换失误、定位球或门将处理，而不是一边倒碾压。`;
        }
        return `${actual}${favorite}要赢，路径是把控球和压迫慢慢兑换成禁区触球；${underdog}要活，核心是前60分钟别让比分先被拉开。`;
      }

      function reportViews(match, top, favoriteSide, favorite, underdog, archetype) {
        const market = match.market_summary?.one_x_two || {};
        const totals = match.market_summary?.over_under_2_5 || {};
        const corners = match.event_predictions?.corners || {};
        const cards = match.event_predictions?.cards || {};
        const minus15 = favoriteCoverage(match, favoriteSide, 1.5);
        const plus15 = underdogCoverage(match, favoriteSide, 1.5);
        const edge = market.model_delta ? signedPct(market.model_delta[favoriteSide] || 0) : "无市场";
        const edgeText = market.status === "available" ? `市场 ${market.books} 家，模型差 ${edge}` : "暂无 1X2 市场，退回模型公平盘";
        return [
          {
            name: "概率派",
            pick: `${top.label} ${pct(top.probability)}`,
            reason: `胜平负分布是 ${pct(match.p_home)} / ${pct(match.p_draw)} / ${pct(match.p_away)}，比分峰值 ${formatLikelyScore(match)}。`,
            warning: "只回答谁更可能赢，不回答盘口深浅。"
          },
          {
            name: "盘口派",
            pick: minus15 >= 0.52 ? `${favorite} -1.5` : `${underdog} +1.5`,
            reason: `${favorite}-1.5 覆盖 ${pct(minus15)}，${underdog}+1.5 覆盖 ${pct(plus15)}；深盘必须和胜负拆开算。`,
            warning: `盘口来自比分矩阵；真实 AH 市场 ${market.status === "available" ? "部分可用" : "不足"}。`
          },
          {
            name: "市场派",
            pick: market.status === "available" ? (Number(market.model_delta?.[favoriteSide] || 0) >= 0 ? `模型高看${favorite}` : `市场更看${favorite}`) : "市场缺口",
            reason: edgeText,
            warning: "市场差异只用于解释价格，不等于下注指令。"
          },
          {
            name: archetype.key === "set_piece" ? "定位球派" : archetype.key === "card_chaos" ? "纪律派" : "风险派",
            pick: archetype.key === "card_chaos" ? `黄牌大3.5 ${pct(cards.over_3_5_yellow_probability)}` : archetype.key === "set_piece" ? `角球大8.5 ${pct(corners.over_8_5_probability)}` : `大2.5 ${pct(match.p_over_2_5)}`,
            reason: archetype.key === "card_chaos"
              ? `总黄牌 ${value(cards.total_yellow_expected, 1)}，任一红牌 ${pct(cards.any_red_probability)}。`
              : archetype.key === "set_piece"
                ? `总角球 ${value(corners.total_expected, 1)}，大9.5 ${pct(corners.over_9_5_probability)}。`
                : `大小球市场 ${totals.status || "missing"}，双方进球 ${pct(match.p_btts)}。`,
            warning: "事件盘口是代理/公共统计优先，置信度低于胜负和比分矩阵。"
          }
        ];
      }

      function reportMaterials(match, favoriteSide, favorite, underdog) {
        const tech = match.tactical_profile || {};
        const favTech = favoriteSide === "home" ? tech.home : tech.away;
        const dogTech = favoriteSide === "home" ? tech.away : tech.home;
        const favMaterial = materialTeam(match, favoriteSide);
        const dogMaterial = materialTeam(match, favoriteSide === "home" ? "away" : "home");
        if (materialAvailable(match)) {
          return [
            {
              title: "真实阵型/首发",
              body: `${match.home_team.name} ${materialTeam(match, "home").formation || "-"}，${match.away_team.name} ${materialTeam(match, "away").formation || "-"}；首发覆盖 ${materialTeam(match, "home").starter_count || 0}/11 vs ${materialTeam(match, "away").starter_count || 0}/11。`,
              value: "ESPN"
            },
            {
              title: `${favorite}真实技术面`,
              body: teamStatsBrief(favMaterial.team_stats || favTech || {}),
              value: `${value((favMaterial.team_stats || {}).shots ?? favTech?.shots_per_game, 0)}射`
            },
            {
              title: "逐球员表现分",
              body: `${favorite}: ${materialPlayerLine(favMaterial.impact_players)}；${underdog}: ${materialPlayerLine(dogMaterial.impact_players)}。表现分是事件数据派生，不是官方评分。`,
              value: "事件派生"
            },
            {
              title: "伤停边界",
              body: `${match.match_materials?.injury_status?.note || "公开 summary 未给确认伤停列表"} 已确认首发会替代赛前观察名单，但伤停仍需 licensed provider。`,
              value: match.match_materials?.injury_status?.status || "未提供"
            }
          ];
        }
        const availability = match.availability || {};
        const favAvail = favoriteSide === "home" ? availability.home : availability.away;
        const dogAvail = favoriteSide === "home" ? availability.away : availability.home;
        const form = match.team_form || {};
        const favForm = favoriteSide === "home" ? form.home : form.away;
        const dogForm = favoriteSide === "home" ? form.away : form.home;
        const favPlayers = (favAvail?.key_players || []).slice(0, 3).map((p) => `${p.name} ${pct(p.rating)}`).join(" / ") || "待接首发";
        const dogPlayers = (dogAvail?.key_players || []).slice(0, 3).map((p) => `${p.name} ${pct(p.rating)}`).join(" / ") || "待接首发";
        return [
          {
            title: `${favorite}进攻材料`,
            body: `xG ${value(favTech?.xg_per_game, 2)}、射门 ${value(favTech?.shots_per_game, 1)}、射正 ${value(favTech?.shots_on_target_per_game, 1)}、控球 ${value(favTech?.possession_pct, 1)}%。`,
            value: favForm?.last_10 || "-"
          },
          {
            title: `${underdog}防守压力`,
            body: `xGA ${value(dogTech?.xga_per_game, 2)}、PPDA ${value(dogTech?.ppda, 1)}、失球 ${value(dogTech?.goals_conceded_18m, 1)}，能否把第一波压迫扛过去是关键。`,
            value: dogForm?.last_10 || "-"
          },
          {
            title: "赛前观察名单",
            body: `${favorite}: ${favPlayers}；${underdog}: ${dogPlayers}。这些是观察名单，不是已确认首发评分。`,
            value: `QDR ${pct(favAvail?.qdr_index || 0)}`
          },
          {
            title: "环境与旅程",
            body: `${match.fixture?.city || "-"} · ${match.weather?.condition || "normal"} · ${favorite}旅程 ${Number(favTech?.projected_travel_km || 0).toLocaleString()}km / ${underdog} ${Number(dogTech?.projected_travel_km || 0).toLocaleString()}km。`,
            value: match.weather?.venue_effect || "-"
          }
        ];
      }

      function materialNote(match) {
        const materials = match.match_materials || {};
        if (materialAvailable(match)) {
          return `${materials.source || "ESPN public match summary"} · ${materials.source_quality || "live_public_summary"} · ${materials.captured_at ? shortTime(materials.captured_at) : "recent"}。首发/阵型/技术统计为真实公开材料；表现分为事件数据派生，不是官方球员评分。`;
        }
        const quality = [
          match.tactical_profile?.data_quality,
          match.availability?.home?.data_quality,
          match.event_predictions?.data_quality
        ].filter(Boolean).join(" · ");
        return `${quality || "mixed source"}。真实首发尚未公开；赛前球员层只保留观察名单，不作为官方评分或确认伤停。`;
      }

      function materialAvailable(match) {
        const materials = match.match_materials || {};
        return materials.material_status === "available" || materials.status === "available";
      }

      function materialTeam(match, side) {
        return ((match.match_materials || {}).teams || {})[side] || {};
      }

      function materialPlayerLine(players) {
        const rows = (players || []).slice(0, 3);
        if (!rows.length) return "暂无球员事件统计";
        return rows.map((player) => {
          const rating = player.performance_rating ? `${value(player.performance_rating, 1)}分` : "-";
          const stats = playerStatSummary(player.stats || {});
          return `${player.short_name || player.name} ${rating}${stats ? ` (${stats})` : ""}`;
        }).join(" / ");
      }

      function playerStatSummary(stats) {
        const parts = [];
        if (stats.goals) parts.push(`${stats.goals}球`);
        if (stats.assists) parts.push(`${stats.assists}助`);
        if (stats.shots_on_target) parts.push(`${stats.shots_on_target}射正`);
        if (stats.saves) parts.push(`${stats.saves}扑救`);
        if (stats.yellow_cards) parts.push(`${stats.yellow_cards}黄`);
        if (stats.red_cards) parts.push(`${stats.red_cards}红`);
        return parts.join(" ");
      }

      function teamStatsBrief(stats) {
        if (!stats) return "暂无技术统计。";
        const pass = stats.total_passes ? `传球 ${stats.accurate_passes || "-"} / ${stats.total_passes}` : "传球未给";
        const cross = stats.total_crosses ? `传中 ${stats.accurate_crosses || "-"} / ${stats.total_crosses}` : "传中未给";
        return `控球 ${value(stats.possession_pct, 1)}%，射门 ${value(stats.shots, 0)}，射正 ${value(stats.shots_on_target, 0)}，角球 ${actualValue(stats.corners)}，${pass}，${cross}，拦截 ${actualValue(stats.interceptions)}，解围 ${actualValue(stats.clearances)}。`;
      }

      function duelTitle(match, archetype, favorite, underdog) {
        if (archetype.key === "deep_favorite") return `${favorite}怎么把优势打成净胜球`;
        if (archetype.key === "knife_edge") return "这场最贵的三个细节";
        if (archetype.key === "set_piece") return "角球/定位球从哪里来";
        if (archetype.key === "card_chaos") return "犯规、牌和定位球连锁";
        if (archetype.key === "weather_drag") return "天气会先影响哪些动作";
        return `${favorite}与${underdog}的对位板`;
      }

      function reportDuels(match, favoriteSide, favorite, underdog, archetype) {
        const edges = (match.matchup?.tactical_edges || [])
          .map((edge) => ({
            title: edge.label,
            body: `${favoriteSide === "home" ? "主队" : "客队"}视角边际 ${signed(favoriteSide === "home" ? edge.home_edge : -edge.home_edge)}，质量 ${edge.data_quality || "unknown"}。`,
            tag: edge.category || "模型因子"
          }))
          .slice(0, 3);
        const corners = match.event_predictions?.corners || {};
        const cards = match.event_predictions?.cards || {};
        const extras = [];
        const homeFormation = materialTeam(match, "home").formation;
        const awayFormation = materialTeam(match, "away").formation;
        if (homeFormation && awayFormation) {
          extras.push({
            title: "真实阵型对位",
            body: `${match.home_team.name} ${homeFormation} 对 ${match.away_team.name} ${awayFormation}；后续判断以这组真实首发结构为准。`,
            tag: "首发阵型"
          });
        }
        if (Number(corners.total_expected || 0) >= 9) {
          extras.push({ title: "边路压制会转成角球数", body: `总角球预期 ${value(corners.total_expected, 1)}，大8.5 ${pct(corners.over_8_5_probability)}。`, tag: "角球" });
        }
        if (Number(cards.total_yellow_expected || 0) >= 4) {
          extras.push({ title: "中场犯规会切碎节奏", body: `总黄牌预期 ${value(cards.total_yellow_expected, 1)}，红牌 ${pct(cards.any_red_probability)}。`, tag: "纪律" });
        }
        if (!extras.length) {
          extras.push({ title: "第一球会改变盘口形态", body: `${favorite}先领先，盘口切到净胜球；${underdog}先扛住，受让盘会越来越硬。`, tag: "比分路径" });
        }
        return [...edges, ...extras].slice(0, 4);
      }

      function reportSections(match, top, favoriteSide, favorite, underdog, archetype) {
        const sections = [];
        const core = coreSection(match, favoriteSide, favorite, underdog, archetype);
        const market = marketSection(match, favoriteSide, favorite, underdog);
        const event = eventSection(match, favoriteSide, favorite, underdog, archetype);
        const post = postMatchSection(match, top, favoriteSide, favorite, underdog);
        if (post) sections.push(post);
        sections.push(core);
        if (archetype.key === "deep_favorite") {
          sections.push(deepLineSection(match, favoriteSide, favorite, underdog));
          sections.push(event);
          sections.push(market);
        } else if (archetype.key === "set_piece") {
          sections.push(event);
          sections.push(setPieceConversionSection(match, favoriteSide, favorite, underdog));
          sections.push(market);
        } else if (archetype.key === "card_chaos") {
          sections.push(event);
          sections.push(cardChainSection(match, favoriteSide, favorite, underdog));
          sections.push(market);
        } else if (archetype.key === "weather_drag") {
          sections.push(weatherSection(match, favoriteSide, favorite, underdog));
          sections.push(event);
          sections.push(market);
        } else if (archetype.key === "knife_edge") {
          sections.push(firstGoalSection(match, favoriteSide, favorite, underdog));
          sections.push(market);
          sections.push(event);
        } else {
          sections.push(market);
          sections.push(event);
        }
        return sections.filter(Boolean).slice(0, hasActualScore(match) ? 5 : 4);
      }

      function coreSection(match, favoriteSide, favorite, underdog, archetype) {
        const tech = match.tactical_profile || {};
        const favTech = favoriteSide === "home" ? tech.home : tech.away;
        const dogTech = favoriteSide === "home" ? tech.away : tech.home;
        const edge = strongestTacticalEdge(match, favoriteSide);
        return {
          title: archetype.key === "deep_favorite" ? `${favorite}不是只强一点，是进攻材料和压迫都更厚` : `${favorite}的主线优势在哪里`,
          kicker: "核心判断",
          source: match.tactical_profile?.source || "process metrics",
          points: [
            {
              title: "机会产量先站在热门方",
              body: `${favorite} xG ${value(favTech?.xg_per_game, 2)}、射门 ${value(favTech?.shots_per_game, 1)}、射正 ${value(favTech?.shots_on_target_per_game, 1)}；${underdog}对应 xGA ${value(dogTech?.xga_per_game, 2)}、PPDA ${value(dogTech?.ppda, 1)}。这决定了它更容易持续进入危险区域。`
            },
            {
              title: edge ? `${edge.label}是放大器` : "对位优势不是单点，而是链条",
              body: edge
                ? `这项边际 ${signed(edge.edge)}，数据质量 ${edge.quality}。它不一定直接变成进球，但会决定压迫、二点球和换人后是否能连续兑现。`
                : `${favorite}如果能把控球安全、前场反抢和禁区触球连起来，${underdog}就会越来越难把球送出压力区。`
            }
          ]
        };
      }

      function deepLineSection(match, favoriteSide, favorite, underdog) {
        const minus15 = favoriteCoverage(match, favoriteSide, 1.5);
        const minus25 = favoriteCoverage(match, favoriteSide, 2.5);
        const plus15 = underdogCoverage(match, favoriteSide, 1.5);
        return {
          title: "这场不能只问赢不赢，要问赢几个",
          kicker: "亚洲盘",
          source: "scoreline matrix",
          points: [
            {
              title: `${favorite}-1.5 和 -2.5 是两道完全不同的门`,
              body: `${favorite}-1.5 覆盖 ${pct(minus15)}，-2.5 覆盖 ${pct(minus25)}。第一道门靠实力差，第二道门靠早进球、持续进攻和后段替补火力。`
            },
            {
              title: `${underdog}+1.5 仍然有生存空间`,
              body: `受让 +1.5 覆盖 ${pct(plus15)}。热门方方向对，不代表深盘一定对；如果领先后降速，胜负命中但盘口可能失败。`
            }
          ]
        };
      }

      function marketSection(match, favoriteSide, favorite, underdog) {
        const market = match.market_summary?.one_x_two || {};
        const totals = match.market_summary?.over_under_2_5 || {};
        if (market.status === "available") {
          return {
            title: "市场没有被我当成答案，而是当成校验器",
            kicker: "市场分歧",
            source: market.source || "The Odds API",
            points: [
              {
                title: `${favorite}方向模型-市场差 ${signedPct(market.model_delta?.[favoriteSide] || 0)}`,
